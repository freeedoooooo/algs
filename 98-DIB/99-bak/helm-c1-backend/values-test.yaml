# ============================================================
# DIB 微服务 Helm Chart — test 环境（70 机器 / worker-5.70）
# ============================================================
# 说明: 完整独立配置，不依赖 values.yaml 的默认值
# 环境: 142=dev / 70=test(本文件) / 101=bank / 239=sh，四套同集群多节点
# 用法: helm install c1-test . --values values-test.yaml --namespace c1-ns-test --server-side=false
# NodePort 分段: 142→300xx / 70→301xx(本文件) / 101→302xx / 239→303xx
# ------------------------------------------------------------
# profile: idc-test-c1 —— 该 profile 全部用 ${C1_*} 占位符，
#          所以下面 config 块的值【真正生效】（由 ConfigMap 注入覆盖镜像默认值）
# ============================================================

# ---------- 全局配置 ----------
namespace: c1-ns-test

# 镜像仓库地址（所有微服务镜像的前缀）
imageRegistry: "10.0.6.183:8088"

# 镜像版本（所有服务统一）—— 部署前请填写实际 tag
image:
  tag: idc-test_latest

# 镜像拉取策略
imagePullPolicy: Always

# 节点调度（所有服务调度到该节点）
nodeName: worker-5.70

# ---------- 公共配置（ConfigMap） ----------
# idc-test-c1 profile 使用 ${C1_*} 占位符，以下值全部生效
config:
  # ---------- 环境标识 ----------
  C1_ENV: "idc-test"

  # ---------- Nacos 注册中心（集群内部署，指向本 namespace 的 c1-nacos） ----------
  C1_NACOS_SERVER_ADDR: "http://c1-nacos.NAMESPACE.svc.cluster.local:8848"
  C1_NACOS_NAMESPACE: "c1"
  C1_NACOS_USERNAME: "c1"
  C1_NACOS_PASSWORD: "c1@2025"

  # ---------- Redis 缓存（集群内部署，指向本 namespace 的 c1-redis） ----------
  C1_REDIS_HOST: "c1-redis.NAMESPACE.svc.cluster.local"
  C1_REDIS_PORT: "6379"
  C1_REDIS_DATABASE: "0"
  C1_REDIS_PASSWORD: "dibredis"

  # ---------- 数据库（外部 MySQL） ----------
  C1_DB_URL: "jdbc:mysql://10.0.6.161:3306/c1_test?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&zeroDateTimeBehavior=convertToNull"
  C1_DB_DRIVER: "com.mysql.cj.jdbc.Driver"
  C1_DB_USERNAME: "root"
  C1_DB_PASSWORD: "Dib12345*"

  # ---------- MinIO 对象存储（外部） ----------
  C1_MINIO_ENDPOINT: "http://10.0.6.163:9000"
  C1_MINIO_ACCESS_KEY: "minioadmin"
  C1_MINIO_SECRET_KEY: "minioadmin"
  C1_MINIO_BUCKET_NAME: "c1-bucket"

  # ---------- OCR 服务 ----------
  C1_OCR_SERVER: "http://192.168.10.91:8089/"

  # ---------- OAuth 认证（对外入口 = 环境域名，经 Ingress → c1-nginx:80） ----------
  C1_OAUTH_CLIENT_HOST: "http://c1-test.dibdata.cn"
  C1_OAUTH_SERVER_HOST: "http://c1-test.dibdata.cn/sso"
  C1_OAUTH_SERVER_HOST_INNER: "http://c1-p-oauth.NAMESPACE.svc.cluster.local:9090/sso"
  C1_OAUTH_CLIENT_CREDENTIALS: "123456"
  C1_OAUTH_REDIRECT_URI: "http://c1-test.dibdata.cn/api/oauth/callback,http://c1-test.dibdata.cn/api-oauth/callback"

# ============================================================
# 基础设施层
# ============================================================

# ---------- Nacos 注册中心 ----------
nacos:
  image: "nacos/nacos-server:v2.3.2"
  storage: 1Gi
  serviceType: NodePort
  nodePortHttp: 30148
  nodePortGrpc: 30149
  # 外挂 MySQL 配置（替代内嵌 Derby）
  mysql:
    host: "10.0.6.161"
    port: "3306"
    database: "nacos_test"
    username: "root"
    password: "Dib12345*"
    params: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"

# ---------- Redis 缓存 ----------
redis:
  image: "redis:7.0"
  storage: 2Gi
  maxmemory: "2g"
  serviceType: NodePort
  nodePort: 30179

# ---------- Nginx 前端网关 ----------
# 注意: 走 Ingress 域名方案后，nginx 容器主入口监听 80，Service 改 ClusterIP（各环境同用 80，无需端口分段）
nginx:
  image: "10.0.6.183:8088/c1/nginx:1.17.8"
  port: 80
  serviceType: ClusterIP

# ============================================================
# 微服务定义（业务服务统一 ClusterIP，仅 Nacos/Redis 保留 NodePort）
# ============================================================

services:

  # ==================== 平台服务层 ====================

  c1_p_oauth:
    tier: platform
    image: "c1/c1-p-oauth"
    port: 9090
    serviceType: ClusterIP
    healthPath: /sso/actuator/health
    replicas: 1

  c1_p_gateway:
    tier: platform
    image: "c1/c1-p-gateway"
    port: 20000
    serviceType: ClusterIP
    healthPath: /actuator/health
    replicas: 1

  c1_p_rbac:
    tier: platform
    image: "c1/c1-p-rbac"
    port: 20001
    serviceType: ClusterIP
    healthPath: /api/auth/actuator/health
    replicas: 1

  c1_p_mdm:
    tier: platform
    image: "c1/c1-p-mdm"
    port: 20002
    serviceType: ClusterIP
    healthPath: /api/mdm/actuator/health
    replicas: 1

  # ==================== 业务服务层 ====================

  c1_b_extract:
    tier: business
    image: "c1/c1-b-extract"
    port: 30001
    serviceType: ClusterIP
    healthPath: /api/extract/actuator/health
    replicas: 1

  c1_b_report:
    tier: business
    image: "c1/c1-b-report"
    port: 30002
    serviceType: ClusterIP
    healthPath: /api/report/actuator/health
    replicas: 1

  c1_b_data:
    tier: business
    image: "c1/c1-b-data"
    port: 30003
    serviceType: ClusterIP
    healthPath: /api/data/actuator/health
    replicas: 1

  c1_b_rule:
    tier: business
    image: "c1/c1-b-rule"
    port: 30004
    serviceType: ClusterIP
    healthPath: /api/rule/actuator/health
    replicas: 1

  c1_b_govern:
    tier: business
    image: "c1/c1-b-govern"
    port: 30005
    serviceType: ClusterIP
    healthPath: /api/dg/actuator/health
    replicas: 1
