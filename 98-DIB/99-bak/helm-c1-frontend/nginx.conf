# ============================================================
# 第一层入口网关 Nginx 配置（架构 A）
# 职责：路由分发 + 后端 API 代理 + 微前端容器代理
#
# 各微前端容器（第二层）仅负责静态文件和 SPA 路由回退
# 本层负责将 URL 前缀剥离后转发到对应容器
#
# 部署方式：ConfigMap 挂载或 Docker COPY
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    proxy_read_timeout 60s;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # ---- 80 端口：主入口（域名 + Ingress 方案，对外 URL 不带端口） ----
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 200m;

        # 全局代理头 - 保留原始 Host 端口
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 网关自身健康检查（不依赖后端容器）
        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # 后端服务代理（与之前一致）
        # ============================================================

        # 认证服务
        location ^~ /sso/ {
            proxy_pass http://c1-p-oauth:9090/sso/;
        }

        # 业务 API → 网关
        location ~ ^/(?:api-oauth|api/(?:oauth|auth|mdm|extract|report|data|rule))/ {
            proxy_pass http://c1-p-gateway:20000;
        }

        # BI 接口（去掉 /bi 前缀）
        # upstream 用集群内 Service 名 c1-dataease（selector-less Service + Endpoints，
        # IP 在 chart values 的 dataeaseExternal 里维护，跨环境不再改 conf）。
        # ⚠️ 前提：网关 Pod 与 c1-dataease Service 同 namespace，且 Service 先于网关启动存在
        location ~ ^/bi/(?<bi_api>de2api|websocket)/ {
            rewrite ^/bi/(de2api|websocket)/(.*)$ /$1/$2 break;
            proxy_pass http://c1-dataease:8100;
        }

        # ============================================================
        # 微前端容器代理（第二层）
        # proxy_pass 尾部 "/" 会剥掉 location 前缀再转发
        # 例: /app-data/assets/a.js → 容器收到 /assets/a.js
        # ============================================================

        # BI 前端（尾部斜杠：剥 /bi/ 前缀后转发；/bi/de2api|websocket/ 已被上方正则
        # 优先截走去 DataEase 服务端，此处只承接 BI 静态资源，nginx 正则优先于前缀匹配）
        location /bi/ {
            proxy_pass http://c1-app-bi/;
        }

        # 数据应用
        location /app-data/ {
            proxy_pass http://c1-app-data/;
        }

        # 导航组件
        location /app-nav/ {
            proxy_pass http://c1-app-nav/;
        }

        # 报告应用
        location /app-report/ {
            proxy_pass http://c1-app-report/;
        }

        # 系统管理
        location /app-system-v2/ {
            proxy_pass http://c1-app-system/;
        }

        # ============================================================
        # 门户（主应用）
        # 门户 Vite base="/app-portal/"：index.html 引用 /app-portal/assets/*，
        # 但产物实际部署在容器 /opt/app 根下（/opt/app/assets/*），无 /opt/app/app-portal/ 这层，
        # 故必须剥掉 /app-portal/ 前缀再转发，否则命中 SPA 兜底返回 index.html（442B）→ 白屏
        # ============================================================
        # 门户静态资源：/app-portal/assets/x.js → 容器收到 /assets/x.js
        location /app-portal/ {
            proxy_pass http://c1-app-portal/;
        }

        # 门户入口：根路径 → 容器 /index.html
        location / {
            proxy_pass http://c1-app-portal;
        }

        # ---- 超时友好提示 ----
        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }
    }
}
