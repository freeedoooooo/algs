worker_processes  1;

events {
    worker_connections  1024;
}


http {
    # 日志输出到 stdout/stderr
    access_log /dev/stdout;
    error_log  /dev/stderr;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    proxy_read_timeout 60s;


    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;


    server {
        listen       80;
        server_name  localhost;

        # SSO 登录页可能因上游重定向丢失 30091 端口，80 端口只负责纠偏回主入口。
        location ^~ /sso/ {
            return 302 http://$host:30091$request_uri;
        }

        location / {
            root   html;
            index  index.html index.htm;
        }

    }

    server {
        listen 30091;
        root /opt/app/frontend/c1-client;
        index index.html index.htm;
        client_max_body_size 200m;

        # 全局代理头配置 - 保留原始 Host 端口，避免认证服务生成无 30091 端口的登录地址。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # 认证页面直接转发到认证服务。^~ 阻止静态资源正则规则截获该请求。
        location ^~ /sso/ {
            proxy_pass http://c1-p-oauth.c1-idc-test.svc.cluster.local:9090/sso/;
        }

        # 业务 API 统一转发到网关，保留原始 URI。
        location ~ ^/(?:api-oauth|api/(?:auth|mdm|extract|report|data|rule))/ {
            proxy_pass http://c1-p-gateway.c1-idc-test.svc.cluster.local:20000;
        }

        # BI 的接口请求去掉 /bi 前缀后转发到 BI 服务。
        location ~ ^/bi/(?<bi_api>de2api|websocket)/ {
            rewrite ^/bi/(de2api|websocket)/(.*)$ /$1/$2 break;
            proxy_pass http://10.0.5.70:8100;
        }

        # 除 BI 接口外的 /bi/ 请求由本地 BI 单页应用处理。
        location /bi/ {
            alias /opt/app/frontend/bi-client/;
            try_files $uri $uri/ /index.html;
        }

        # 匹配任意部署前缀下的 app-* 静态文件。
        # 例如 /tenant/app-data/assets/a.js 会捕获 app_name=app-data、asset_path=/assets/a.js，
        # 并从 /opt/app/frontend/c1-client/app-data/assets/a.js 返回文件；文件不存在时返回 404。
        location ~ ^/(?:[^/]+/)*(?<app_name>app-[^/]+)(?<asset_path>/.*\.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|webp|svg))$ {
            try_files /$app_name$asset_path =404;
            access_log off;
        }

        # 门户在 URL 根路径暴露资源，但实际文件位于 app-portal/assets 目录。
        location ~ ^(?<asset_path>/assets/.*\.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|webp|svg))$ {
            try_files /app-portal$asset_path =404;
            access_log off;
        }

        # 门户入口存在时跳转门户，否则跳转报告应用。
        location = / {
            if (-f $document_root/app-portal/index.html) {
                return 302 /portal;
            }

            return 302 /app-report;
        }

        # 子应用使用各自的 History 路由回退。
        # app_path 先尝试静态文件和目录，均不存在时才返回应用入口。
        location ~ ^/(?:[^/]+/)*(?<app_name>app-(?:report|data|system-v2))(?<app_path>/.*)?$ {
            try_files /$app_name$app_path /$app_name$app_path/ /$app_name/index.html;
        }

        # 门户路由和资源优先；门户不存在时由报告应用处理。
        location / {
            try_files /app-portal$uri /app-portal$uri/ /app-portal/index.html /app-report/index.html;
        }
        
        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }

    }

}
