# ============================================================
# 私有镜像仓库认证
# ============================================================
# 说明: 用于从 10.0.6.183:8088 拉取镜像的认证凭据
# 生成方式:
#   echo -n 'username:password' | base64
#   然后替换下方 .dockerconfigjson 中的值
#
# 方式一（推荐）: 使用 kubectl 命令自动生成:
#   kubectl create secret docker-registry dib-registry-secret \
#     --namespace=c1-idc-test \
#     --docker-server=10.0.6.183:8088 \
#     --docker-username=<用户名> \
#     --docker-password=<密码> \
#     --docker-email=<邮箱> \
#     --dry-run=client -o yaml > image-pull-secret.yaml
#
# 方式二: 如果仓库无需认证，删除本文件并移除各 Deployment 中的
#         imagePullSecrets 引用即可
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: dib-registry-secret
  namespace: c1-idc-test
  labels:
    app.kubernetes.io/part-of: dib-platform
type: kubernetes.io/dockerconfigjson
data:
  # 请替换为实际的 base64 编码凭据
  # 推荐使用上面的 kubectl 命令自动生成
  .dockerconfigjson: eyJhdXRocyI6eyJ0MC4wLjYuMTgzOjgwODgiOnsiYXV0aCI6ImFXMXFiM0owWlRwbGMyTjEiLCJwYXNzd29yZCI6IlZHVmpaWEpzWVdSbGNsTnZiWEJzYjJRPSJ9fX0=
