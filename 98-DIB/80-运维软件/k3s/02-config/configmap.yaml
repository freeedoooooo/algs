# ============================================================
# DIB 微服务公共配置（全部明文，后续可迁移至 Secret 加密）
# ============================================================
# 说明: 存放所有配置（含密码），各微服务通过 envFrom 引用
# 修改后需重启 Pod 生效（或使用 ConfigMap 热更新）
# TODO: 生产环境稳定后，将密码字段迁移至 Secret 加密管理
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: dib-common-config
  namespace: c1-idc-test
  labels:
    app.kubernetes.io/part-of: dib-platform
data:
  # ---------- Spring Profile ----------
  # 环境标识，对应 Docker Compose 中的 C1_ENV
  # 可选值: dev / test / pro
  C1_ENV: "idc-test-c1"

  # ---------- Nacos 注册中心 ----------
  # K3s 内部 Nacos 地址（部署 infra/nacos.yaml 后可用）
  C1_NACOS_SERVER_ADDR: "http://nacos.c1-idc-test.svc.cluster.local:8848"
  # 如需连接外部 Nacos，修改为外部地址，如:
  # C1_NACOS_SERVER_ADDR: "http://10.0.5.70:8848"
  C1_NACOS_NAMESPACE: "c1-dev"
  C1_NACOS_USERNAME: "c1"
  C1_NACOS_PASSWORD: "c1@2025"

  # ---------- Redis ----------
  # K3s 内部 Redis 地址（部署 infra/redis.yaml 后可用）
  C1_REDIS_HOST: "redis.c1-idc-test.svc.cluster.local"
  C1_REDIS_PORT: "6379"
  C1_REDIS_DATABASE: "0"
  C1_REDIS_PASSWORD: "dibredis"

  # ---------- 数据库（外部 MySQL）----------
  # 完整 JDBC URL
  C1_DB_URL: "jdbc:mysql://10.0.6.161:3306/dib_report_copilot?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&zeroDateTimeBehavior=convertToNull"
  C1_DB_DRIVER: "com.mysql.cj.jdbc.Driver"
  C1_DB_USERNAME: "root"
  C1_DB_PASSWORD: "Dib12345*"

  # ---------- MinIO（外部部署）----------
  C1_MINIO_ENDPOINT: "http://10.0.6.163:9000"

  # ---------- OCR 服务 ----------
  C1_OCR_SERVER: "http://192.168.10.91:8089/"

  # ---------- OAuth / Gateway ----------
  # OAuth 回调地址（给浏览器用，必须是外部可访问的 URL）
  C1_GATEWAY_OAUTH_CLIENT_HOST: "http://10.0.5.142:30091"
  # Gateway 访问 OAuth 的地址（K8s 内部 Service）
  C1_GATEWAY_OAUTH_SERVER_HOST: "http://c1-p-oauth.c1-idc-test.svc.cluster.local:9090"
  C1_GATEWAY_OAUTH_SERVER_HOST_INNER: "http://c1-p-oauth.c1-idc-test.svc.cluster.local:9090"
  C1_OAUTH_CLIENT_CREDENTIALS: "123456"
