# c1-p-rbac — 权限资源管理
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-p-rbac
  namespace: c1-idc-test
  labels:
    app: c1-p-rbac
    tier: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c1-p-rbac
  template:
    metadata:
      labels:
        app: c1-p-rbac
        tier: platform
    spec:
      imagePullSecrets:
        - name: dib-registry-secret
      containers:
        - name: c1-p-rbac
          image: 10.0.6.183:8088/c1/p-rbac:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 20001
              name: http
              protocol: TCP
          env:
            - name: C1_ENV
              valueFrom:
                configMapKeyRef:
                  name: dib-common-config
                  key: C1_ENV
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: dib-common-config

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/rbac/actuator/health
              port: 20001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/rbac/actuator/health
              port: 20001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-p-rbac
  namespace: c1-idc-test
  labels:
    app: c1-p-rbac
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 20001
      targetPort: 20001
      protocol: TCP
  selector:
    app: c1-p-rbac
