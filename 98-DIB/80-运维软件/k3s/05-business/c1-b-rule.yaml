# c1-b-rule — 规则引擎
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-b-rule
  namespace: c1-idc-test
  labels:
    app: c1-b-rule
    tier: business
spec:
  replicas: 1
  selector:
    matchLabels:
      app: c1-b-rule
  template:
    metadata:
      labels:
        app: c1-b-rule
        tier: business
    spec:
      imagePullSecrets:
        - name: dib-registry-secret
      containers:
        - name: c1-b-rule
          image: 10.0.6.183:8088/c1/b-rule:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 30004
              name: http
              protocol: TCP
          env:
            - name: C1_ENV
              valueFrom:
                configMapKeyRef:
                  name: dib-common-config
                  key: C1_ENV
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: dib-common-config

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "3Gi"
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/rule/actuator/health
              port: 30004
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/rule/actuator/health
              port: 30004
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-b-rule
  namespace: c1-idc-test
  labels:
    app: c1-b-rule
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 30004
      targetPort: 30004
      protocol: TCP
  selector:
    app: c1-b-rule
