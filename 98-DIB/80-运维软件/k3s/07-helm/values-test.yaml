  DB_PASSWORD: "Dib12345*"
  REDIS_PASSWORD: "dibredis"
  NACOS_PASSWORD: "c1@2025"

services:
  c1-p-gateway:
    replicas: 1
  c1-p-oauth:
    replicas: 1
  c1-p-rbac:
    replicas: 1
  c1-p-mdm:
    replicas: 1
  c1-b-extract:
    replicas: 1
  c1-b-report:
    replicas: 1
  c1-b-data:
    replicas: 1
  c1-b-rule:
    replicas: 1
  c1-b-govern:
    replicas: 1
