# Nacos v2.3.2 注册中心（Standalone 模式）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nacos.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: nacos
          image: {{ .Values.nacos.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
              name: http
              protocol: TCP
            - containerPort: 9848
              name: grpc
              protocol: TCP
          env:
            - name: MODE
              value: "standalone"
            # ---------- 外挂 MySQL：替代内嵌 Derby ----------
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            - name: MYSQL_SERVICE_HOST
              value: {{ .Values.nacos.mysql.host | quote }}
            - name: MYSQL_SERVICE_PORT
              value: {{ .Values.nacos.mysql.port | quote }}
            - name: MYSQL_SERVICE_DB_NAME
              value: {{ .Values.nacos.mysql.database | quote }}
            - name: MYSQL_SERVICE_USER
              value: {{ .Values.nacos.mysql.username | quote }}
            - name: MYSQL_SERVICE_PASSWORD
              value: {{ .Values.nacos.mysql.password | quote }}
            - name: MYSQL_SERVICE_DB_PARAM
              value: {{ .Values.nacos.mysql.params | quote }}
            # ---------- 鉴权 ----------
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "admin"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "admin"
            - name: NACOS_AUTH_TOKEN
              value: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg="
            # ---------- 时区 ----------
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            {{- toYaml .Values.nacos.resources | nindent 12 }}
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
            - name: nacos-logs
              mountPath: /home/nacos/logs
          startupProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: nacos-data-pvc
        - name: nacos-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
  selector:
    app: nacos
