# Nacos v2.3.2 注册中心（Standalone 模式）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.nacos.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: {{ .Values.nacos.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
              name: http
              protocol: TCP
            - containerPort: 9848
              name: grpc
              protocol: TCP
          env:
            - name: MODE
              value: "standalone"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "admin"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "admin"
            - name: NACOS_AUTH_TOKEN
              value: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg="
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            {{- toYaml .Values.nacos.resources | nindent 12 }}
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
            - name: nacos-logs
              mountPath: /home/nacos/logs
          livenessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: nacos-data-pvc
        - name: nacos-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: {{ .Values.namespace }}
  labels:
    app: nacos
    {{- include "dib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
  selector:
    app: nacos
