# Redis 7.0 缓存服务
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: c1-redis-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: c1-redis
  template:
    metadata:
      labels:
        app: c1-redis
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: c1-redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          command:
            - redis-server
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - {{ .Values.redis.maxmemory | quote }}
            - "--maxmemory-policy"
            - "allkeys-lru"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: c1-common-config
                  key: C1_REDIS_PASSWORD
            - name: TZ
              value: "Asia/Shanghai"
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli -a $REDIS_PASSWORD ping | grep PONG"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli -a $REDIS_PASSWORD ping | grep PONG"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: c1-redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: c1-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-redis
spec:
  type: {{ .Values.redis.serviceType }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
      {{- if eq .Values.redis.serviceType "NodePort" }}
      nodePort: {{ .Values.redis.nodePort }}
      {{- end }}
  selector:
    app: c1-redis
