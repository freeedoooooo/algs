# c1-b-rule — 规则引擎
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-b-rule
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-b-rule
    tier: business
spec:
  replicas: {{ .Values.services.c1-b-rule.replicas }}
  selector:
    matchLabels:
      app: c1-b-rule
  template:
    metadata:
      labels:
        app: c1-b-rule
        tier: business
    spec:
      imagePullSecrets:
        - name: dib-registry-secret
      containers:
        - name: c1-b-rule
          image: {{ .Values.imageRegistry }}/{{ .Values.services.c1-b-rule.image }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 30004
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: dib-common-config
          resources:
            {{- toYaml .Values.services.c1-b-rule.resources | nindent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.services.c1-b-rule.healthPath }}
              port: 30004
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.services.c1-b-rule.healthPath }}
              port: 30004
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-b-rule
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-b-rule
spec:
  type: {{ .Values.services.c1-b-rule.serviceType }}
  ports:
    - name: http
      port: 30004
      targetPort: 30004
      protocol: TCP
  selector:
    app: c1-b-rule
