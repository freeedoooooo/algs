# gateway — API 网关
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
    tier: platform
spec:
  replicas: {{ .Values.services.gateway.replicas }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: platform
    spec:
      imagePullSecrets:
        - name: dib-registry-secret
      containers:
        - name: gateway
          image: {{ .Values.imageRegistry }}/c1/platform-gateway:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 20000
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: dib-common-config
          resources:
            {{- toYaml .Values.services.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 20000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 20000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: gateway
spec:
  type: {{ .Values.services.gateway.serviceType }}
  ports:
    - name: http
      port: 20000
      targetPort: 20000
      protocol: TCP
      {{- if eq .Values.services.gateway.serviceType "NodePort" }}
      nodePort: {{ .Values.services.gateway.nodePort }}
      {{- end }}
  selector:
    app: gateway
