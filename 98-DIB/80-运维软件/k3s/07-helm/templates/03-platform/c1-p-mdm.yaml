# c1-p-mdm — 主数据管理
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-p-mdm
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-p-mdm
    tier: platform
spec:
  replicas: {{ .Values.services.c1_p_mdm.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: c1-p-mdm
  template:
    metadata:
      labels:
        app: c1-p-mdm
        tier: platform
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: c1-p-mdm
          image: {{ .Values.imageRegistry }}/{{ .Values.services.c1_p_mdm.image }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 20002
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: c1-common-config
          resources:
            {{- toYaml .Values.services.c1_p_mdm.resources | nindent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          startupProbe:
            httpGet:
              path: {{ .Values.services.c1_p_mdm.healthPath }}
              port: 20002
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ .Values.services.c1_p_mdm.healthPath }}
              port: 20002
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.services.c1_p_mdm.healthPath }}
              port: 20002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-p-mdm
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-p-mdm
spec:
  type: {{ .Values.services.c1_p_mdm.serviceType }}
  ports:
    - name: http
      port: 20002
      targetPort: 20002
      protocol: TCP
      {{- if eq .Values.services.c1_p_mdm.serviceType "NodePort" }}
      nodePort: {{ .Values.services.c1_p_mdm.nodePort }}
      {{- end }}
  selector:
    app: c1-p-mdm
