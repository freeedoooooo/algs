# c1-p-rbac — 权限资源管理
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-p-rbac
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-p-rbac
    tier: platform
spec:
  replicas: {{ .Values.services.c1-p-rbac.replicas }}
  selector:
    matchLabels:
      app: c1-p-rbac
  template:
    metadata:
      labels:
        app: c1-p-rbac
        tier: platform
    spec:
      imagePullSecrets:
        - name: dib-registry-secret
      containers:
        - name: c1-p-rbac
          image: {{ .Values.imageRegistry }}/{{ .Values.services.c1-p-rbac.image }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 20001
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: dib-common-config
          resources:
            {{- toYaml .Values.services.c1-p-rbac.resources | nindent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          livenessProbe:
            httpGet:
              path: {{ .Values.services.c1-p-rbac.healthPath }}
              port: 20001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.services.c1-p-rbac.healthPath }}
              port: 20001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-p-rbac
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-p-rbac
spec:
  type: {{ .Values.services.c1-p-rbac.serviceType }}
  ports:
    - name: http
      port: 20001
      targetPort: 20001
      protocol: TCP
  selector:
    app: c1-p-rbac
