# ============================================================
# DIB 微服务 Helm Chart — 默认配置
# ============================================================
# 说明: 此文件包含所有可变参数，不同环境通过 --values 覆盖
# 用法: helm install dib . --values values-prod.yaml
# ============================================================

# ---------- 全局配置 ----------
namespace: c1-idc-test

# 镜像仓库地址（所有微服务镜像的前缀）
imageRegistry: "10.0.6.183:8088"

# 镜像版本（所有微服务的默认 tag，各服务可单独覆盖）
image:
  tag: latest

# 镜像拉取策略
imagePullPolicy: Always

# 节点调度（所有服务调度到该节点，改这里即可切换节点）
nodeName: worker-5.142

# ---------- 公共配置（ConfigMap） ----------
# 所有微服务通过 envFrom 注入以下环境变量
config:
  # ---------- 环境标识 ----------
  C1_ENV: "idc-test-c1"

  # ---------- Nacos 注册中心 ----------
  C1_NACOS_SERVER_ADDR: "http://nacos.c1-idc-test.svc.cluster.local:8848"
  C1_NACOS_NAMESPACE: "c1-dev"
  C1_NACOS_USERNAME: "c1"
  C1_NACOS_PASSWORD: "c1@2025"

  # ---------- Redis 缓存 ----------
  C1_REDIS_HOST: "redis.c1-idc-test.svc.cluster.local"
  C1_REDIS_PORT: "6379"
  C1_REDIS_DATABASE: "0"
  C1_REDIS_PASSWORD: "dibredis"

  # ---------- 数据库（MySQL） ----------
  C1_DB_URL: "jdbc:mysql://10.0.6.161:3306/dib_report_copilot?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&zeroDateTimeBehavior=convertToNull"
  C1_DB_DRIVER: "com.mysql.cj.jdbc.Driver"
  C1_DB_USERNAME: "root"
  C1_DB_PASSWORD: "Dib12345*"

  # ---------- MinIO 对象存储 ----------
  C1_MINIO_ENDPOINT: "http://10.0.6.163:9000"
  C1_MINIO_ACCESS_KEY: "minioadmin"
  C1_MINIO_SECRET_KEY: "minioadmin"
  C1_MINIO_BUCKET_NAME: "c1-bucket"

  # ---------- OCR 服务 ----------
  C1_OCR_SERVER: "http://192.168.10.91:8089/"

  # ---------- OAuth 认证 ----------
  C1_OAUTH_CLIENT_HOST: "http://10.0.5.142:30091"
  C1_OAUTH_SERVER_HOST: "http://10.0.5.142:30091/sso"
  C1_OAUTH_SERVER_HOST_INNER: "http://c1-p-oauth.c1-idc-test.svc.cluster.local:9090/sso"
  C1_OAUTH_CLIENT_CREDENTIALS: "123456"
  C1_OAUTH_REDIRECT_URI: "http://10.0.5.142:30091/api/oauth/callback,http://10.0.5.142:30091/api-oauth/callback"

# ============================================================
# 基础设施层
# ============================================================

# ---------- Nacos 注册中心 ----------
nacos:
  image: "nacos/nacos-server:v2.3.2"
  storage: 1Gi
  # 外挂 MySQL 配置（替代内嵌 Derby）
  mysql:
    host: "10.0.6.161"
    port: "3306"
    database: "nacos_dev"
    username: "root"
    password: "Dib12345*"
    params: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ---------- Redis 缓存 ----------
redis:
  image: "redis:7.0"
  storage: 2Gi
  maxmemory: "512mb"
  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "768Mi"

# ---------- Nginx 前端网关 ----------
nginx:
  image: "10.0.6.183:8088/c1/nginx:1.17.8"
  port: 30091
  serviceType: NodePort
  nodePort: 30091
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ============================================================
# 微服务定义
# ============================================================
# 每个服务的可配置参数:
#   image       - 镜像名（不含 registry 和 tag）
#   tag         - 镜像版本（覆盖全局 image.tag）
#   port        - 容器端口
#   serviceType - Service 类型（ClusterIP / NodePort）
#   nodePort    - NodePort 端口（仅 serviceType=NodePort 时有效）
#   healthPath  - 健康检查路径
#   replicas    - 副本数
#   resources   - 资源限制
# ============================================================

services:

  # ==================== 平台服务层 ====================

  c1-p-oauth:
    tier: platform
    image: "c1/c1-p-oauth"
    port: 9090
    serviceType: NodePort
    nodePort: 30090
    healthPath: /sso/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  c1-p-gateway:
    tier: platform
    image: "c1/c1-p-gateway"
    port: 20000
    serviceType: NodePort
    nodePort: 30020
    healthPath: /actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  c1-p-rbac:
    tier: platform
    image: "c1/c1-p-rbac"
    port: 20001
    serviceType: NodePort
    nodePort: 30021
    healthPath: /api/auth/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  c1-p-mdm:
    tier: platform
    image: "c1/c1-p-mdm"
    port: 20002
    serviceType: NodePort
    nodePort: 30022
    healthPath: /api/mdm/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

  # ==================== 业务服务层 ====================

  c1-b-extract:
    tier: business
    image: "c1/c1-b-extract"
    port: 30001
    serviceType: ClusterIP
    healthPath: /api/extract/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "12Gi"
      limits:
        cpu: "2000m"
        memory: "18Gi"

  c1-b-report:
    tier: business
    image: "c1/c1-b-report"
    port: 30002
    serviceType: ClusterIP
    healthPath: /api/report/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "3Gi"

  c1-b-data:
    tier: business
    image: "c1/c1-b-data"
    port: 30003
    serviceType: ClusterIP
    healthPath: /api/data/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        cpu: "1500m"
        memory: "6Gi"

  c1-b-rule:
    tier: business
    image: "c1/c1-b-rule"
    port: 30004
    serviceType: ClusterIP
    healthPath: /api/rule/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "3Gi"

  c1-b-govern:
    tier: business
    image: "c1/c1-b-govern"
    port: 30005
    serviceType: ClusterIP
    healthPath: /api/dg/actuator/health
    replicas: 1
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1536Mi"
