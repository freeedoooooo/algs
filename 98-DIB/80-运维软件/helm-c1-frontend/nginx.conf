# ============================================================
# 第一层入口网关 Nginx 配置（架构 A）
# 职责：路由分发 + 后端 API 代理 + 微前端容器代理
#
# 各微前端容器（第二层）仅负责静态文件和 SPA 路由回退
# 本层负责将 URL 前缀剥离后转发到对应容器
#
# 部署方式：ConfigMap 挂载或 Docker COPY
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    proxy_read_timeout 60s;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # ---- 80 端口：纠偏到主入口 ----
    server {
        listen       80;
        server_name  localhost;

        # SSO 登录页可能因上游重定向丢失 30091 端口，80 端口只负责纠偏回主入口
        location ^~ /sso/ {
            return 302 http://$host:30091$request_uri;
        }

        location / {
            root   html;
            index  index.html index.htm;
        }
    }

    # ---- 30091 端口：主入口 ----
    server {
        listen 30091;
        server_name localhost;
        client_max_body_size 200m;

        # 全局代理头 - 保留原始 Host 端口
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 网关自身健康检查（不依赖后端容器）
        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # 后端服务代理（与之前一致）
        # ============================================================

        # 认证服务
        location ^~ /sso/ {
            proxy_pass http://c1-p-oauth:9090/sso/;
        }

        # 业务 API → 网关
        location ~ ^/(?:api-oauth|api/(?:oauth|auth|mdm|extract|report|data|rule))/ {
            proxy_pass http://c1-p-gateway:20000;
        }

        # BI 接口（去掉 /bi 前缀）
        location ~ ^/bi/(?<bi_api>de2api|websocket)/ {
            rewrite ^/bi/(de2api|websocket)/(.*)$ /$1/$2 break;
            proxy_pass http://10.0.5.70:8100;
        }

        # ============================================================
        # 微前端容器代理（第二层）
        # proxy_pass 尾部 "/" 会剥掉 location 前缀再转发
        # 例: /app-data/assets/a.js → 容器收到 /assets/a.js
        # ============================================================

        # BI 前端
#         location /bi/ {
#             proxy_pass http://c1-app-bi/;
#         }

        # 数据应用
        location /app-data/ {
            proxy_pass http://c1-app-data/;
        }

        # 导航组件
        location /app-nav/ {
            proxy_pass http://c1-app-nav/;
        }

        # 报告应用
        location /app-report/ {
            proxy_pass http://c1-app-report/;
        }

        # 系统管理
        location /app-system-v2/ {
            proxy_pass http://c1-app-system/;
        }

        # ============================================================
        # 门户（默认应用，处理根路径）
        # 门户 Vite base="/" ，不需要剥前缀，直接透传
        # ============================================================
        location / {
            proxy_pass http://c1-app-portal;
        }

        # ---- 超时友好提示 ----
        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }
    }
}
