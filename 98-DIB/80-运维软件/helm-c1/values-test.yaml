  C1_DB_PASSWORD: "Dib12345*"
  C1_REDIS_PASSWORD: "dibredis"
  C1_NACOS_PASSWORD: "c1@2025"

services:
  c1_p_gateway:
    replicas: 1
  c1_p_oauth:
    replicas: 1
  c1_p_rbac:
    replicas: 1
  c1_p_mdm:
    replicas: 1
  c1_b_extract:
    replicas: 1
  c1_b_report:
    replicas: 1
  c1_b_data:
    replicas: 1
  c1_b_rule:
    replicas: 1
  c1_b_govern:
