apiVersion: v1
kind: ConfigMap
metadata:
  name: dib-c1-config
  namespace: dib-c1
data:
  # Nacos
  NACOS_SERVER_ADDR: "nacos-headless.dib-c1.svc.cluster.local:8848"
  NACOS_NAMESPACE: "dev-c1"
  NACOS_USERNAME: "c1"
  # Redis
  REDIS_HOST: "redis-host"          # TODO: 按实际环境修改
  REDIS_PORT: "6379"
  REDIS_DATABASE: "0"
  # MySQL
  MYSQL_HOST: "mysql-host"          # TODO: 按实际环境修改
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "dib_report_copilot"
  # OpenGauss (auth-server 使用)
  OPENGAUSS_HOST: "opengauss-host"  # TODO: 按实际环境修改
  OPENGAUSS_PORT: "5432"
  # MinIO
  MINIO_ENDPOINT: "http://minio-host:9000"  # TODO: 按实际环境修改
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_BUCKET: "c1-bucket"
  # 通用
  TZ: "Asia/Shanghai"
