apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-data-hpa
  namespace: dib-c1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-data
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
