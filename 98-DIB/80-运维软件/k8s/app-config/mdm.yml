# ============================================================
# K8s / Compose 环境配置 - mdm
# 部署时通过环境变量注入数据库、Redis、MinIO 连接信息
# 对应原模块：data-cloud-mdm/data-cloud-mdm-web
# 目标路径：data-cloud-mdm-web/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: mdm
  # datasource - 通过环境变量 SPRING_DATASOURCE_URL 等注入
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
      # 启用 Nacos 服务发现
      # 如果需要调用 auth-resource 等内部服务，通过 Nacos 发现

dib:
  file:
    server: minioFileService
    minio:
      enable: true
      root-path:
      end-point: ${DIB_FILE_MINIO_END_POINT:http://minio-host:9000}
      access-key: ${DIB_FILE_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${DIB_FILE_MINIO_SECRET_KEY:minioadmin}
      bucket-name: ${DIB_FILE_MINIO_BUCKET_NAME:c1-bucket}
