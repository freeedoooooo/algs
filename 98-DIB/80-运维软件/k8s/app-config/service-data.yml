# ============================================================
# K8s / Compose 环境配置 - service-data
# 部署时通过环境变量注入 Redis 连接信息
# 对应原模块：dib-agent-service-data/dib-agent-service-data-web
# 目标路径：dib-agent-service-data-web/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: service-data
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
    loadbalancer:
      nacos:
        enabled: true

dib:
  # 分布式ID数据机器位配置
  distribute:
    datacenterId: ${DISTRIBUTE_DATACENTER_ID:2}
    workerId: ${DISTRIBUTE_WORKER_ID:2}
  di:
    report-date-update-enabled: false
  converter:
    tmp-path: ${C1_EXTRACT_CONVERTER_TMP_PATH:/tmp}
    ocr-enable: ${C1_EXTRACT_CONVERTER_OCR_ENABLE:true}
  feign:
    mdm:
      name: mdm
  cache: redis
