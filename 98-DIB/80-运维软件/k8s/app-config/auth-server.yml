# ============================================================
# K8s / Compose 环境配置 - auth-server
# 部署时通过环境变量注入数据库和 Redis 连接信息
# 对应原模块：data-cloud-auth-server
# 目标路径：data-cloud-auth-server/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: auth-server
  # datasource - 通过环境变量 SPRING_DATASOURCE_URL 等注入
  datasource:
    driver-class-name: org.opengauss.Driver
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}

mybatis-plus:
  db-type: POSTGRE_SQL
  configuration:
    variables:
      escape_character: '"'
