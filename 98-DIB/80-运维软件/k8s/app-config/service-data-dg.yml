# ============================================================
# K8s / Compose 环境配置 - service-data-dg
# 部署时通过环境变量注入数据库和 Redis 连接信息
# 对应原模块：dib-agent-data-dg/dib-agent-data-dg-web
# 目标路径：dib-agent-data-dg-web/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: service-data-dg
  devtools:
    restart:
      enabled: false
  # datasource - 通过环境变量 SPRING_DATASOURCE_URL 等注入
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
    loadbalancer:
      nacos:
        enabled: true

dib:
  tyc:
    token: ${TYC_TOKEN:}
  schedule:
    dg:
      tyc-pull-enabled: false
      tyc-push-enabled: false
