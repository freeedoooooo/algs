# ============================================================
# K8s / Compose 环境配置 - service-extract
# 部署时通过环境变量注入数据库和 Redis 连接信息
# 对应原模块：dib-agent-service-extract/dib-agent-service-extract-web
# 目标路径：dib-agent-service-extract-web/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: service-extract
  # datasource - 通过环境变量 SPRING_DATASOURCE_URL 等注入
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  # nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
    loadbalancer:
      nacos:
        enabled: true

dib:
  # 分布式ID数据机器位配置（多实例时应不同，可通过 env 注入）
  distribute:
    datacenterId: ${DISTRIBUTE_DATACENTER_ID:2}
    workerId: ${DISTRIBUTE_WORKER_ID:2}
  converter:
    tmp-path: ${C1_EXTRACT_CONVERTER_TMP_PATH:/opt/app/tmp}
    enable: true
    ocr-enable: ${C1_EXTRACT_CONVERTER_OCR_ENABLE:true}
  extractor:
    clean-exception-cell-enabled: true
  extract:
    enable: false
    auto-test: false
    mail-to: ${EXTRACT_MAIL_TO:}
  data-sync:
    enable: false
  ai-model:
    api-url: ${AI_MODEL_API_URL:}
    api-key: ${AI_MODEL_API_KEY:}
    model-name: ${AI_MODEL_NAME:qwen3:1.7b}
  tb:
    classify:
      enable: false
  etl:
    enable: false
  check:
    field-name-id: id
    field-name-doc-id: doc_id
  cache: redis
