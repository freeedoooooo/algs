# ============================================================
# K8s / Compose 环境配置 - gateway
# 使用 Nacos 服务发现，路由通过 lb:// 负载均衡
# 对应原模块：data-cloud-gateway
# 目标路径：data-cloud-gateway/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-host}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
    loadbalancer:
      nacos:
        enabled: true
    gateway:
      server:
        webflux:
          routes:
            # auth
            - id: auth-resource
              uri: lb://auth-resource
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=0
            # mdm
            - id: mdm
              uri: lb://mdm
              predicates:
                - Path=/api/mdm/**
              filters:
                - StripPrefix=0
            # extract
            - id: service-extract
              uri: lb://service-extract
              predicates:
                - Path=/api/extract/**
              filters:
                - StripPrefix=0
            # report
            - id: service-report
              uri: lb://service-report
              predicates:
                - Path=/api/report/**
              filters:
                - StripPrefix=0
            # data-view 限流路由
            - id: service-data-view
              uri: lb://service-data
              predicates:
                - Path=/api/data/di/tableAsset/dataView,/api/data/di/tableAsset/dataExport,/api/data/di/indexAsset/dataView
                - Method=POST
              filters:
                - StripPrefix=0
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 4
                    redis-rate-limiter.requestedTokens: 2
                    key-resolver: "#{@ipApiCombinedKeyResolver}"
            # data 其他接口
            - id: service-data
              uri: lb://service-data
              predicates:
                - Path=/api/data/**
              filters:
                - StripPrefix=0
            # rule
            - id: service-rule
              uri: lb://service-rule
              predicates:
                - Path=/api/rule/**
              filters:
                - StripPrefix=0

dib:
  oauth:
    client:
      id: c1
      credentials: 123456
    server:
      type: dibAuth
      host: http://auth-server.dib-c1.svc.cluster.local:9090/sso
      host-inner: http://auth-server.dib-c1.svc.cluster.local:9090/sso
    filter: token
