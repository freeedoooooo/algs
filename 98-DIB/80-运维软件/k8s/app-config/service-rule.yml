# ============================================================
# K8s / Compose 环境配置 - service-rule
# 部署时通过环境变量注入数据库和 Redis 连接信息
# 对应原模块：dib-agent-service-rule/dib-agent-service-rule-web
# 目标路径：dib-agent-service-rule-web/src/main/resources/application-k8s.yml
# ============================================================
spring:
  application:
    name: service-rule
  # datasource - 通过环境变量 SPRING_DATASOURCE_URL 等注入
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
  # nacos（service-rule 当前未注册到 Nacos，如需服务发现可启用）
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:nacos-headless.dib-c1.svc.cluster.local:8848}
        namespace: ${SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE:dev-c1}
        service: ${spring.application.name}
        username: ${SPRING_CLOUD_NACOS_DISCOVERY_USERNAME:c1}
        password: ${SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD:}
    loadbalancer:
      nacos:
        enabled: true

dib:
  # 分布式ID数据机器位配置
  distribute:
    datacenterId: ${DISTRIBUTE_DATACENTER_ID:2}
    workerId: ${DISTRIBUTE_WORKER_ID:2}
  cache: redis
  schedule:
    biz-rule:
      calc-enabled: false
      task-create-enabled: false
    frame:
      calc-enabled: false
      auto-create-enabled: false
      cron-refresh-enabled: false
      node-code-refresh-enabled: false
      value-gc-enabled: false
  task-monitor:
    enabled: false
