apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdm
  namespace: dib-c1
  labels:
    app: mdm
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mdm
  template:
    metadata:
      labels:
        app: mdm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "20002"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: mdm
          image: hub.dibtime.com/dib-c1/platform-mdm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 20002
              name: http
          env:
            - name: C1_ENV
              value: "k8s"
            # Nacos
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_SERVER_ADDR
            - name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_NAMESPACE
            - name: SPRING_CLOUD_NACOS_DISCOVERY_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_USERNAME
            - name: SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-nacos-secret
                  key: NACOS_PASSWORD
            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-redis-secret
                  key: REDIS_PASSWORD
            # MySQL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/$(MYSQL_DATABASE)?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&zeroDateTimeBehavior=convertToNull&allowMultiQueries=true"
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_DATABASE
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: MYSQL_PASSWORD
            # MinIO
            - name: DIB_FILE_MINIO_END_POINT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MINIO_ENDPOINT
            - name: DIB_FILE_MINIO_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MINIO_ACCESS_KEY
            - name: DIB_FILE_MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MINIO_BUCKET
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 20002
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 20002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
      imagePullSecrets:
        - name: harbor-registry-secret
