apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-extract
  namespace: dib-c1
  labels:
    app: service-extract
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-extract
  template:
    metadata:
      labels:
        app: service-extract
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "30001"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # service-extract 内存需求大（12-16g），建议调度到高性能节点
      # nodeSelector:
      #   node-type: high-memory
      containers:
        - name: service-extract
          image: hub.dibtime.com/dib-c1/c1-extract:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 30001
              name: http
          env:
            - name: C1_ENV
              value: "k8s"
            # Nacos
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_SERVER_ADDR
            - name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_NAMESPACE
            - name: SPRING_CLOUD_NACOS_DISCOVERY_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_USERNAME
            - name: SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-nacos-secret
                  key: NACOS_PASSWORD
            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-redis-secret
                  key: REDIS_PASSWORD
            # MySQL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/$(MYSQL_DATABASE)?characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&useSSL=false&zeroDateTimeBehavior=convertToNull"
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: MYSQL_DATABASE
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: MYSQL_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: "4"
              memory: "12Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 30001
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 30001
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: app-tmp
              mountPath: /opt/app/tmp
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: app-tmp
          emptyDir:
            sizeLimit: 10Gi
      imagePullSecrets:
        - name: harbor-registry-secret
