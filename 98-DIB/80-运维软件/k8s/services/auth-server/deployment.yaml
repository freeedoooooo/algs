apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: dib-c1
  labels:
    app: auth-server
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-server
          image: hub.dibtime.com/dib-c1/platform-auth-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: C1_ENV
              value: "k8s"
            # Nacos
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_SERVER_ADDR
            - name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_NAMESPACE
            - name: SPRING_CLOUD_NACOS_DISCOVERY_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: NACOS_USERNAME
            - name: SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-nacos-secret
                  key: NACOS_PASSWORD
            # Redis
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: REDIS_PORT
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-redis-secret
                  key: REDIS_PASSWORD
            # OpenGauss
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:opengauss://$(OPENGAUSS_HOST):$(OPENGAUSS_PORT)/c1?currentSchema=dib_report_copilot&ssl=false"
            - name: OPENGAUSS_HOST
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: OPENGAUSS_HOST
            - name: OPENGAUSS_PORT
              valueFrom:
                configMapKeyRef:
                  name: dib-c1-config
                  key: OPENGAUSS_PORT
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: OPENGAUSS_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dib-c1-db-secret
                  key: OPENGAUSS_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
      imagePullSecrets:
        - name: harbor-registry-secret
