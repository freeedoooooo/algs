# ClusterRole：允许 Prometheus 发现 Pod / Service / Endpoint / Node
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c1-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c1-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c1-prometheus
subjects:
  - kind: ServiceAccount
    name: c1-prometheus
    namespace: {{ .Release.Namespace }}
