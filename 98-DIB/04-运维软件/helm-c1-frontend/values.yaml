# ============================================================
# c1-frontend Helm Chart — 基础配置（142 / dev 环境）
# ============================================================
# 说明: 微前端双层 Nginx 架构部署
#   第一层: 入口网关（路由分发 + 后端代理）
#   第二层: 各微前端容器（纯静态文件服务）
# 用法: helm install c1-frontend . --namespace c1-ns-dev
# NodePort 分段: 142→300xx / 70→301xx / 101→302xx / 239→303xx
# ============================================================

# ---------- 全局配置 ----------
namespace: c1-ns-dev

# 镜像仓库地址
imageRegistry: "10.0.6.183:8088"

# 镜像版本（所有前端容器统一）
image:
  tag: idc-dev_latest

# 镜像拉取策略
imagePullPolicy: Always

# 节点调度
nodeName: worker-5.142


# ============================================================
# 第二层：微前端容器
# ============================================================
# 微前端容器默认资源（可在各 frontend 下用 resources 覆盖）
frontendResources:
  requests:
    cpu: "20m"
    memory: "32Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# 所有容器共用相同的 nginx.conf 和 Dockerfile
# 仅镜像名不同，端口统一为 80
# serviceType 统一为 ClusterIP（仅网关内部访问，不对外暴露）
frontends:

  c1-app-portal:
    image: "c1/c1-app-portal"
    port: 80
    replicas: 1

  c1-app-data:
    image: "c1/c1-app-data"
    port: 80
    replicas: 1

  c1-app-nav:
    image: "c1/c1-app-nav"
    port: 80
    replicas: 1

  c1-app-report:
    image: "c1/c1-app-report"
    port: 80
    replicas: 1

  c1-app-system:
    image: "c1/c1-app-system"
    port: 80
    replicas: 1

  # BI 前端（如有独立容器化需求可启用）
  # c1-app-bi:
  #   image: "c1/c1-app-bi"
  #   port: 80
  #   replicas: 1
