# c1-b-rule — 规则引擎
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-b-rule
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-b-rule
    tier: business
spec:
  replicas: {{ .Values.services.c1_b_rule.replicas }}
  selector:
    matchLabels:
      app: c1-b-rule
  template:
    metadata:
      labels:
        app: c1-b-rule
        tier: business
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/rule/actuator/prometheus"
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: c1-b-rule
          image: {{ .Values.imageRegistry }}/{{ .Values.services.c1_b_rule.image }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 30004
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: c1-configmap-common
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          startupProbe:
            httpGet:
              path: {{ .Values.services.c1_b_rule.healthPath }}
              port: 30004
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.services.c1_b_rule.healthPath }}
              port: 30004
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.services.c1_b_rule.healthPath }}
              port: 30004
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: c1-b-rule
  namespace: {{ .Values.namespace }}
  labels:
    app: c1-b-rule
spec:
  type: {{ .Values.services.c1_b_rule.serviceType }}
  ports:
    - name: http
      port: 30004
      targetPort: 30004
      protocol: TCP
      {{- if eq .Values.services.c1_b_rule.serviceType "NodePort" }}
      nodePort: {{ .Values.services.c1_b_rule.nodePort }}
      {{- end }}
  selector:
    app: c1-b-rule
