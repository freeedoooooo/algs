worker_processes  1;

events {
    worker_connections  1024;
}


http {
    # 日志输出到 stdout/stderr
    access_log /dev/stdout;
    error_log  /dev/stderr;

    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    proxy_read_timeout 60s;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    server {
        listen 8090;
        root /opt/app/frontend/c1-client;
        index index.html index.htm;
        client_max_body_size 200m;

        # 全局代理头配置 - 保留原始 Host 端口，避免认证服务生成无 8090 端口的登录地址。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # 认证中心服务端代理
        location ^~ /sso/ {
            proxy_pass http://platform-auth-server:9090/sso/;
        }

        # 网关代理
        location ^~ /nologin/entry/ {
            proxy_pass http://platform-gateway:20000/api/oauth/ipLogin/;
        }

        location ^~ /api/ {
            proxy_pass http://platform-gateway:20000/api/;
        }

        # BI 后台接口代理
        location ^~ /bi/de2api/ {
            proxy_pass http://dataease:8100/de2api/;
        }
        location ^~ /bi/websocket/ {
            proxy_pass http://dataease:8100/websocket/;
            # WebSocket 升级必需
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # BI 单页应用
        location ^~ /bi/ {
            alias /opt/app/frontend/bi-client/;
            try_files $uri $uri/ /index.html;
        }
        
        # 子应用静态资源代理
        location ~ ^\/app-(?<appName>[a-zA-Z0-9\-]+) {
            try_files $uri $uri/ /app-$appName/index.html /app-portal/index.html /app-report/index.html =404;
            access_log off;
        }

        # 默认首页代理
        location = / {
            if (-f $document_root/app-portal/index.html) {
                return 302 /app-portal?$args;
            }

            return 302 /app-report?$args;
        }

        # 兜底路由（门户优先；未匹配路径交给门户 SPA 处理）
        location / {
            try_files $uri /app-portal/index.html /app-report/index.html;
        }
        
        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }

    }

}
