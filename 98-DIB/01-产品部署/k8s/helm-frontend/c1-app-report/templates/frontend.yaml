# ============================================================
# 微前端单应用容器（第二层）：Deployment + Service
# 职责：纯静态文件服务 + SPA 路由回退 + /healthz 健康检查
# 资源名 = .Chart.Name，与网关 nginx.conf 中 proxy_pass 主机名一致
# serviceType 统一 ClusterIP：仅供第一层网关内部访问，不对外暴露
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    tier: frontend
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        tier: frontend
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          resources:
{{ toYaml .Values.resources | indent 12 }}
          # 健康检查：访问容器内置 /healthz，不依赖任何静态文件
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    tier: frontend
spec:
  type: {{ .Values.serviceType }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
  selector:
    app: {{ .Chart.Name }}
