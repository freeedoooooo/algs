# Nacos v2.3.2 注册中心（Standalone 模式）
# 由 helm-c1-backend/templates/02-infra/nacos.yaml 拆分而来
# 资源名 = .Chart.Name = c1-nacos（须与各服务 C1_NACOS_SERVER_ADDR 主机名一致）
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-data-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8848
              name: http
              protocol: TCP
            - containerPort: 9848
              name: grpc
              protocol: TCP
          env:
            - name: MODE
              value: "standalone"
            # ---------- 外挂 MySQL：替代内嵌 Derby ----------
            - name: SPRING_DATASOURCE_PLATFORM
              value: "mysql"
            - name: MYSQL_SERVICE_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: MYSQL_SERVICE_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: MYSQL_SERVICE_DB_NAME
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_SERVICE_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_SERVICE_PASSWORD
              value: {{ .Values.mysql.password | quote }}
            - name: MYSQL_SERVICE_DB_PARAM
              value: {{ .Values.mysql.params | quote }}
            # ---------- 鉴权 ----------
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "admin"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "admin"
            - name: NACOS_AUTH_TOKEN
              value: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg="
            # ---------- 时区 ----------
            - name: TZ
              value: "Asia/Shanghai"
            # ---------- JVM 内存（容器 limits 2Gi，堆设 1g 留余量） ----------
            - name: JVM_OPT
              value: "-Xms1g -Xmx1g -Xmn256m"
          resources:
            requests:
              cpu: "100m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
            - name: nacos-logs
              mountPath: /home/nacos/logs
          startupProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: 8848
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nacos-data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-data-pvc
        - name: nacos-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      protocol: TCP
      {{- if eq .Values.serviceType "NodePort" }}
      nodePort: {{ .Values.nodePortHttp }}
      {{- end }}
    - name: grpc
      port: 9848
      targetPort: 9848
      protocol: TCP
      {{- if eq .Values.serviceType "NodePort" }}
      nodePort: {{ .Values.nodePortGrpc }}
      {{- end }}
  selector:
    app: {{ .Chart.Name }}
