# Traefik Controller Deployment
# mode=hostNetwork: 容器直接用宿主机端口(80/443/9000)，URL 干净
# mode=nodePort:    普通 Pod，由 Service 暴露 NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-traefik
  namespace: {{ .Values.traefik.namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: c1-ingress
spec:
  replicas: {{ .Values.traefik.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: c1-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: c1-ingress
    spec:
      serviceAccountName: c1-traefik
      {{- if eq .Values.traefik.exposure.mode "hostNetwork" }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.traefik.useNodeSelector }}
      nodeSelector:
        node-name: {{ .Values.traefik.nodeName }}
      {{- end }}
      {{- with .Values.traefik.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.traefik.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: traefik
          image: {{ .Values.traefik.image }}
          imagePullPolicy: {{ .Values.traefik.imagePullPolicy }}
          args:
            - "--entrypoints.web.address=:{{ .Values.traefik.exposure.webPort }}"
            - "--entrypoints.websecure.address=:{{ .Values.traefik.exposure.websecurePort }}"
            - "--entrypoints.traefik.address=:{{ .Values.traefik.exposure.traefikPort }}"
            - "--providers.kubernetesingress"
            - "--providers.kubernetesingress.ingressclass={{ .Values.ingressClass.name }}"
            - "--api.dashboard=false"
            - "--api.insecure=true"
            - "--ping=true"
            - "--ping.entrypoint=traefik"
            - "--log.level=INFO"
            {{- with .Values.traefik.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: web
              containerPort: {{ .Values.traefik.exposure.webPort }}
              protocol: TCP
            - name: websecure
              containerPort: {{ .Values.traefik.exposure.websecurePort }}
              protocol: TCP
            - name: traefik
              containerPort: {{ .Values.traefik.exposure.traefikPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.traefik.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            capabilities:
              add: ["NET_BIND_SERVICE"]
