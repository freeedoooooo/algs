# Traefik Service
# mode=nodePort:    NodePort 暴露 30080/30443（对外入口）
# mode=hostNetwork: 仅 ClusterIP（对外靠宿主机 80/443，Service 供集群内访问）
apiVersion: v1
kind: Service
metadata:
  name: c1-traefik
  namespace: {{ .Values.traefik.namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: c1-ingress
spec:
  {{- if eq .Values.traefik.exposure.mode "nodePort" }}
  type: NodePort
  {{- else }}
  type: ClusterIP
  {{- end }}
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: c1-ingress
  ports:
    - name: web
      port: {{ .Values.traefik.exposure.webPort }}
      targetPort: web
      protocol: TCP
      {{- if eq .Values.traefik.exposure.mode "nodePort" }}
      nodePort: {{ .Values.traefik.exposure.webNodePort }}
      {{- end }}
    - name: websecure
      port: {{ .Values.traefik.exposure.websecurePort }}
      targetPort: websecure
      protocol: TCP
      {{- if eq .Values.traefik.exposure.mode "nodePort" }}
      nodePort: {{ .Values.traefik.exposure.websecureNodePort }}
      {{- end }}
