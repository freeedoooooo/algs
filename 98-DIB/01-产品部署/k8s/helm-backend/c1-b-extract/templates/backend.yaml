# ============================================================
# 后端微服务通用模板（由 helm-c1-backend/templates/03~04 拆分而来）
# 资源名 = .Chart.Name，服务差异全部由 values 驱动
# 依赖：envFrom 注入公共 ConfigMap（由 helm-infra/config 部署）
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    tier: {{ .Values.tier }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        tier: {{ .Values.tier }}
      annotations:
        prometheus.io/scrape: {{ .Values.prometheus.scrape | quote }}
        {{- if .Values.prometheus.path }}
        prometheus.io/path: {{ .Values.prometheus.path | quote }}
        {{- end }}
    spec:
      nodeSelector:
        node-name: {{ .Values.nodeName }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.imageRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapName }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: app-logs
              mountPath: /opt/app/logs
            {{- range .Values.extraVolumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            - name: fonts
              mountPath: /usr/share/fonts
              readOnly: true
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: {{ .Values.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: {{ .Values.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: {{ .Values.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-logs
          emptyDir: {}
        {{- range .Values.extraVolumes }}
        - name: {{ .name }}
          {{- if .sizeLimit }}
          emptyDir:
            sizeLimit: {{ .sizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: fonts
          hostPath:
            path: /usr/share/fonts
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  type: {{ .Values.serviceType }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      {{- if eq .Values.serviceType "NodePort" }}
      nodePort: {{ .Values.nodePort }}
      {{- end }}
  selector:
    app: {{ .Chart.Name }}
