# ============================================================
# c1-b-extract Helm Chart — 基础配置（142 / dev 环境）
# ============================================================
# 用法: helm upgrade --install c1-b-extract . -n c1-ns-dev --server-side=false
# 前置: 需先部署 helm-infra/config（提供 c1-configmap-common）
# 环境差异（namespace/nodeName/image.tag）由 values-<env>.yaml 覆盖
# ============================================================

namespace: c1-ns-dev
nodeName: worker-5.142

imageRegistry: "10.0.6.183:8088"
image:
  repository: "c1/c1-b-extract"
  tag: idc-dev_latest
imagePullPolicy: Always

tier: business
port: 30001
serviceType: ClusterIP
healthPath: /api/extract/actuator/health
replicas: 1

prometheus:
  scrape: true
  path: /api/extract/actuator/prometheus

# 高内存服务
resources:
  requests:
    cpu: "250m"
    memory: "3Gi"
  limits:
    cpu: "2000m"
    memory: "6Gi"

# 额外挂载：临时目录（提取过程读写 /tmp）
extraVolumeMounts:
  - name: app-tmp
    mountPath: /tmp
extraVolumes:
  - name: app-tmp
    sizeLimit: 5Gi

# 公共 ConfigMap（由 helm-infra/config 部署）
configMapName: c1-configmap-common
