services:
  dbx:
    # image: t8y2/dbx:latest
    # For faster pulls in China, use the CNB image instead:
    image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: never
    ports:
      - "4224:4224"
    environment:
      - DBX_PUBLIC_BASE_PATH=/dbx
      - DBX_DISABLE_PASSWORD_VIEWER=true
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped

volumes:
  dbx-data:
