#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
    proxy_read_timeout 60s;

    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # 建行 OCR 双节点：保留原有故障切换策略。
    upstream ocr_backend {
        server myhost:8088 max_fails=5 fail_timeout=30s;
        server myhost:8089 max_fails=5 fail_timeout=30s;
    }

    # Docker DNS 解析器，变量形式 proxy_pass 需要依赖它刷新网关 DNS。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen       80;
        server_name  localhost;

        # 保留历史路由版行为：80 端口访问 SSO 时跳转到应用端口。
        location ^~ /sso/ {
            return 302 http://$host:8090$request_uri;
        }

        location / {
            root   html;
            index  index.html index.htm;
        }

    }

    # c1 前端与后端网关
    server {
        listen 8090;
        root /opt/app/c1-client;
        index index.html index.htm;

        client_max_body_size 200m;

        # 后端代理通用请求头。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;


        # 匹配任意部署前缀下的 app-* 静态文件。
        location ~ ^/(?:[^/]+/)*(?<app_name>app-[^/]+)(?<asset_path>/.*\.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|webp|svg))$ {
            try_files /$app_name$asset_path =404;
            access_log off;
        }

        location /bi/ {
            alias /opt/app/bi-client/;
            try_files $uri $uri/ /index.html;
        }

        location = / {
            return 302 /app-report;
        }

        location ~ ^/(?:[^/]+/)*(?<app_name>app-(?:report|data|system-v2))(?<app_path>/.*)?$ {
            try_files /$app_name$app_path /$app_name$app_path/ /$app_name/index.html;
        }

        location / {
            try_files /app-report$uri /app-report$uri/ /app-report/index.html;
        }

        # ============ 后端代理路由 ============

        # OCR 必须使用 ^~，确保优先于下面的通用 /api 正则代理。
        location ^~ /api-ocr {
            rewrite ^/api-ocr/?(.*)$ /$1 break;
            proxy_pass http://ocr_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 200M;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # 认证中心，保留 bank-dev 原始目标主机。
        location ^~ /sso/ {
            client_max_body_size 200m;
            proxy_pass http://myhost:9090/sso/;
        }

        # dbx 代理，转发到 myhost:4224。
        location ^~ /dbx/ {
            client_max_body_size 200m;
            proxy_pass http://myhost:4224;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 通用网关代理，保持 nginx.conf-v20260624 的宽泛匹配能力。
        # 变量形式 proxy_pass 会使用上方 resolver 刷新 Docker DNS。
        location ~ ^/(api-oauth|api)/ {
            client_max_body_size 200m;

            set $gateway_upstream http://platform-gateway:20000;
            proxy_pass $gateway_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        location ~ ^/bi/(?<bi_api>de2api|websocket)/ {
            rewrite ^/bi/(de2api|websocket)/(.*)$ /$1/$2 break;
            proxy_pass http://10.0.5.70:8100;
        }

        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }

    }
}
