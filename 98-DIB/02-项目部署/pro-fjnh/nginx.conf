
#user  nobody;
worker_processes  1;

error_log  /var/log/nginx/nginx-error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/nginx-access.log;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  120;
    proxy_read_timeout 120s;
    client_max_body_size 200M;

    #gzip  on;

    # 福建能化
    server {
        listen 8000;
        index index.html index.htm;
        root /opt/www/c1-client;

        location = / {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            return 301 ./app-c1/;
        }
        location / {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Cache-Control, Content-Type, DNT, If-Modified-Since, Keep-Alive, Origin, User-Agent, X-Requested-With' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            try_files $uri $uri/ /index.html;
        }
        
        location /api-auth/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-auth/;
        }
        
        location /api-oauth/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-oauth/;
        }
        
        location /api-rg/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-rg/;
        }
        
        location /api-c1/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-c1/;
        }

        location /api-var/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-var/;
        }
        
        location /api-extract/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-extract/;
        }
        
        location /api-mdm/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api-mdm/;
        }
        
        location /api/data/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api/data/;
        }
        location /api/rule/ {
            client_max_body_size 200m;
            proxy_pass http://127.0.0.1:7105/api/rule/;
        }  

        error_page 504 /custom_504.html;
        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }
        location @router {
            rewrite ^.*$ /index.html last;        
        }
    }
}
