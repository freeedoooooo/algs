networks:
  c1-network:
    name: c1-network
    driver: bridge

services:
  ########## 以下为 platform 各微服务 ##########
  platform-auth-server:
    image: platform-auth-server:${C1_VERSION:-latest}
    container_name: platform-auth-server
    networks:
      - c1-network
    ports:
      - "9090:9090"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/platform-auth-server/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped

  platform-eureka:
    image: platform-eureka:${C1_VERSION:-latest}
    container_name: platform-eureka
    networks:
      - c1-network
    ports:
      - "10000:10000"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/platform-eureka/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped

  platform-gateway:
    image: platform-gateway:${C1_VERSION:-latest}
    container_name: platform-gateway
    networks:
      - c1-network
    ports:
      - "20000:20000"
      - "27105:20000"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/platform-gateway/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped

  platform-auth-resource:
    image: platform-auth-resource:${C1_VERSION:-latest}
    container_name: platform-auth-resource
    networks:
      - c1-network
    ports:
      - "20001:20001"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/platform-auth-resource/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped

  platform-mdm:
    image: platform-mdm:${C1_VERSION:-latest}
    container_name: platform-mdm
    networks:
      - c1-network
    ports:
      - "20002:20002"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/platform-mdm/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped

  ########## 以下为 c1 各业务微服务 ##########
  c1-extract:
    image: c1-extract:${C1_VERSION:-latest}
    container_name: c1-extract
    networks:
      - c1-network
    ports:
      - "30001:30001"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
      - OCR_SERVER=http://192.168.10.91:8089/
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/c1-extract/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:30001/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  c1-report:
    image: c1-report:${C1_VERSION:-latest}
    container_name: c1-report
    networks:
      - c1-network
    ports:
      - "30002:30002"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/c1-report/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:30002/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  c1-data:
    image: c1-data:${C1_VERSION:-latest}
    container_name: c1-data
    networks:
      - c1-network
    ports:
      - "30003:30003"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/c1-data/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:30003/api/data/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  c1-rule:
    image: c1-rule:${C1_VERSION:-latest}
    container_name: c1-rule
    networks:
      - c1-network
    ports:
      - "30004:30004"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/c1-rule/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:30004/api/rule/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  c1-dg:
    image: c1-dg:${C1_VERSION:-latest}
    container_name: c1-dg
    networks:
      - c1-network
    ports:
      - "30005:30005"
    environment:
      - C1_ENV=${C1_ENV:?缺少 C1_ENV 环境变量}
    env_file:
      - .env.db
    volumes:
      - /opt/app/backend/c1-dg/logs:/opt/app/logs
      - /usr/share/fonts:/usr/share/fonts
      - /opt/gbase/gbase_hosts:/opt/gbase/gbase_hosts
      - /opt/tongweb:/opt/tongweb
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:30005/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s