#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;
events {
    worker_connections 1024;
}


http {
    include mime.types;
    default_type application/octet-stream;

    #access_log  logs/access.log  main;

    sendfile on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout 65;
    proxy_read_timeout 60s;


    # 开启 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;


    server {
        listen 80;
        server_name localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;
        location / {
            root html;
            index index.html index.htm;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }

    }


    server {
        listen 8090;
        index index.html index.htm;
        port_in_redirect off;

        # 重定向根路径到 /tbpj/app
        location = / {
            return 301 /tbpj/app/app-c1/;
        }

        # 处理静态文件和前端路由
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 处理C1客户端静态文件和前端路由
        location /tbpj/app/ {
            alias /opt/app/c1-client/;
            try_files $uri $uri/ /index.html;
        }

        # 处理BI客户端静态文件和前端路由
        location /tbpj/bi/ {
            alias /opt/app/bi-client/;
            try_files $uri $uri/ /index.html;
        }

        # 处理 C1 API 代理
        location /tbpj/app/api-oauth/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-oauth/;
        }

        location /tbpj/app/api-auth/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-auth/;
        }

        location /tbpj/app/api-mdm/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-mdm/;
        }

        location /tbpj/app/api-extract/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-extract/;
        }

        location /tbpj/app/api-rg/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-rg/;
        }

        location /tbpj/app/api-c1/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api-c1/;
        }

        location /tbpj/app/api/report/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api/report/;
        }

        location /tbpj/app/api/data/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api/data/;
        }

        location /tbpj/app/api/rule/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:20000/api/rule/;
        }

        # 处理 BI API 代理
        location /tbpj/bi/de2api/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:8100/de2api/;
        }

        location /tbpj/bi/websocket/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:8100/websocket/;
        }


        # 认证中心登录页
        location /tbpj/login/ {
            client_max_body_size 200m;
            proxy_pass http://10.5.210.161:9090/tbpj/login/;
        }


        # 自定义 504 错误页面
        error_page 504 /custom_504.html;

        location = /custom_504.html {
            internal;
            default_type text/plain;
            return 504 '抱歉，您的请求未能及时得到响应。请稍后刷新查看执行结果！';
        }

        location @router {
            rewrite ^.*$ /index.html last;
        }
    }

}