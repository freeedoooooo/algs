<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/wizard.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化平台</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/extract">解析</a>
  <a href="/templates">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <a href="/tasks" class="on">任务</a>
  <span class="spacer"></span>
  <span class="navnote">全部任务的执行记录</span>
</nav>
<div class="pagebody">
  <div class="pagehead">
    <h1>任务记录</h1>
    <span class="spacer"></span>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索任务 id / 文件名…">
      <select id="fstate">
        <option value="">全部状态</option>
        <option value="extracting">提取中</option>
        <option value="previewed">已预览</option>
        <option value="loading">入库中</option>
        <option value="loaded">已入库</option>
        <option value="partial">部分入库</option>
        <option value="failed">失败</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <table class="list">
      <thead><tr>
        <th class="seq">序号</th><th>任务ID</th><th>资料</th><th>模板</th><th>入库目标</th>
        <th>状态</th><th>时间</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
</div>
<div class="drawer" id="detail" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="dtitle">任务详情</h2>
      <span id="dbadge"></span>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="dclose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot" id="dfoot"></div>
  </div>
</div>
<div class="drawer" id="receipt" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="rctitle">入库回执</h2>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="rcclose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="rcbody"></div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/tasks.js"></script>
</body>
</html>
