<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提取 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/upload.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">结构化平台</span>
  <a href="/" class="on">提取</a>
  <a href="/sources">资料</a>
  <a href="/templates">模板</a>
  <a href="/staging">校验</a>
  <a href="/load">入库</a>
  <a href="/tasks">任务</a>
  <span class="spacer"></span>
  <span class="navnote">P2 · 提取校验入库</span>
</nav>
<div class="app">
  <aside class="console">
    <div id="drop">
      <b>点击或拖拽文件到此处</b>
      pdf/csv/png/jpg/bmp/webp/txt/md，可多选，单个 ≤ 20MB
    </div>
    <input type="file" id="picker" multiple
      accept=".png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff,.pdf,.csv,.txt,.md">
    <div class="srcrow">
      <button type="button" class="ghost mini" id="fromsrc">从资料库选择 ▸</button>
      <span class="hint" tabindex="0" data-tip="选已登记的文件直接发起提取，&#10;不必重新上传。">?</span>
    </div>
    <ul class="files" id="filelist"></ul>
    <div class="filebar" id="filebar" hidden>
      <span id="filecount"></span>
      <button type="button" class="mini" id="clearfiles">清空列表</button>
    </div>
    <div class="tplrow">
      <label for="tplsel">模板</label>
      <select id="tplsel"></select>
      <span class="hint" tabindex="0" data-tip="模板＝怎么读这份文件。&#10;固定字段模板：产出规范字段，可入库。&#10;原始透传：每表每行一条，键=表头原文，&#10;只可预览，不可入库。">?</span>
    </div>
    <div class="row">
      <button id="go" disabled>开始提取</button>
      <span class="hint" tabindex="0" data-tip="首次加载模型约 20~40 秒，之后复用更快。">?</span>
      <span id="msg"></span>
    </div>
    <details class="params" id="parampanel">
      <summary class="params-head">
        <span class="params-title">参数</span>
        <span class="pbadge" id="parambadge">默认</span>
        <span class="hint" tabindex="0" onclick="event.preventDefault()"
              data-tip="按优先级排，留默认即可；仅影响本次上传。">?</span>
        <span class="spacer"></span>
        <button type="button" class="mini" id="resetparams">恢复默认</button>
      </summary>
      <div class="param-groups" id="paramgroups"></div>
    </details>
  </aside>
  <div class="gutter" id="gutter" title="拖动调整左栏宽度&#10;双击恢复默认"></div>
  <main class="reportcol">
    <div class="reportempty" id="reportempty">
      <div class="re-inner">
        <b>对照报告将显示在这里</b>
        <span>选择文件后点「开始提取」。</span>
      </div>
    </div>
    <div class="runpanel" id="runpanel" hidden>
      <div class="runcard">
        <div class="runbar">
          <span id="runstage">准备中…</span>
          <span class="spacer"></span>
          <span id="runpct">0%</span>
          <a class="mini-link" id="stglink" hidden>预览提取数据</a>
          <a class="mini-link" id="dlLog" href="/api/logs" target="_blank">下载日志</a>
          <button type="button" class="mini-link" id="logclose" hidden>关闭</button>
        </div>
        <div class="track"><div class="fill" id="runfill"></div></div>
        <div class="logbox" id="log"></div>
      </div>
    </div>
    <div class="histbar" id="histbar" hidden>
      <label for="histsel">历史报告</label>
      <select id="histsel"></select>
    </div>
    <div class="filetabs" id="filetabs" hidden></div>
    <iframe id="reportFrame" class="reportframe" hidden title="对照报告"></iframe>
    <button type="button" class="logbtn" id="logbtn" hidden>查看日志</button>
  </main>
</div>
<div class="drawer" id="srcdrawer" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2>从资料库选择</h2>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="srcclose">关闭 (Esc)</button>
    </div>
    <div class="dbody">
      <div class="toolbar" style="margin-bottom:10px">
        <input type="search" id="srcq" placeholder="搜索文件名…">
      </div>
      <div class="banner warn" id="srcdegraded" hidden>
        平台库未连接，资料目录暂不可用。可直接在左侧上传文件（会自动留档）。
      </div>
      <ul class="srclist" id="srclist"></ul>
      <div class="empty" id="srcempty" hidden><b>资料库是空的</b>先在左侧上传，或到资料页登记。</div>
    </div>
    <div class="dfoot">
      <span id="srccount">已选 0 个</span>
      <span class="spacer" style="flex:1"></span>
      <button type="button" class="btn" id="srcgo" disabled>提取所选文件</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden>
  <div class="lbtop">
    <button type="button" id="lbPick">取 x 坐标</button>
    <span class="hint" tabindex="0" data-tip="取数=原图像素&#10;适用 doc_unwarp=off">?</span>
    <button type="button" id="lbZoom">1:1 像素</button>
    <span class="spacer"></span>
    <button type="button" id="lbClose">关闭 (Esc)</button>
  </div>
  <div class="lbstage" id="lbStage">
    <div class="lbwrap" id="lbwrap">
      <img id="lbimg" alt="预览">
      <svg id="lbsvg" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div class="pickbar" id="pickbar" hidden>
    <span class="picklabel">点图取 x</span>
    <span class="pickvals" id="pickvals"></span>
    <button type="button" data-pick="fill">填入列边界</button>
    <button type="button" data-pick="copy">复制</button>
    <button type="button" data-pick="clear">清空</button>
    <button type="button" data-pick="exit">退出取数</button>
  </div>
</div>
<script src="/static/hint.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/upload.js"></script>
</body>
</html>
