<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行记录 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">结构化平台</span>
  <a href="/">提取</a>
  <a href="/sources">资料</a>
  <a class="off" title="P1 开放">模板</a>
  <a class="off" title="P1 开放">校验</a>
  <a class="off" title="P2 开放">入库</a>
  <a href="/runs" class="on">记录</a>
  <span class="spacer"></span>
  <span class="navnote">P0 · 预览链路</span>
</nav>
<div class="pagebody">
  <div class="pagehead">
    <h1>运行记录</h1>
    <span class="sub">运行目录来自平台库 run / run_file 表投影</span>
    <span class="spacer"></span>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索运行 id / 文件名…">
      <select id="fstate">
        <option value="">全部状态</option>
        <option value="extracting">运行中</option>
        <option value="previewed">已预览</option>
        <option value="failed">失败</option>
      </select>
      <select id="fmode">
        <option value="">全部模式</option>
        <option value="preview">预览</option>
        <option value="load">入库</option>
      </select>
    </div>
  </div>
  <div class="panel">
    <table class="list">
      <thead><tr>
        <th>运行</th><th>文件</th><th>模板</th><th>模式</th>
        <th>状态</th><th>时间</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <b>还没有运行记录</b>
      到 <a href="/">提取页</a> 上传文件，或从 <a href="/sources">资料库</a> 选文件发起。
    </div>
  </div>
</div>
<div class="drawer" id="detail" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="dtitle">运行详情</h2>
      <span id="dbadge"></span>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="dclose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot" id="dfoot"></div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/runs.js"></script>
</body>
</html>
