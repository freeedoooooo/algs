<div class="pager" data-file="{{ idx }}" data-total="{{ n }}" data-pages="{{ nums }}">
    <button type="button" class="pg-btn" data-pg="first" title="第一页">«</button>
    <button type="button" class="pg-btn" data-pg="prev" title="上一页">‹</button>
    <span class="pg-nums"></span>
    <button type="button" class="pg-btn" data-pg="next" title="下一页">›</button>
    <button type="button" class="pg-btn" data-pg="last" title="最后一页">»</button>
    <span class="pg-count"><input class="pg-jump" type="text" inputmode="numeric" value="{{ first }}"
                                  title="输入页码，回车跳转"><i>/</i><b>{{ n }}</b></span></div>
