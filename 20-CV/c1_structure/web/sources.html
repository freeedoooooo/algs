<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资料文件 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/hint.css">
<link rel="stylesheet" href="/static/wizard.css">
<link rel="stylesheet" href="/static/sources.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources" class="on">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <span class="spacer"></span>
  <span class="navnote">原件归档与检索</span>
</nav>
<div class="pagebody">
  <div class="pagehead">
    <h1>资料文件</h1>
    <span class="spacer"></span>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索文件名…">
      <button type="button" class="btn mini" id="qbtn">查询</button>
      <select id="kind">
        <option value="">全部类型</option>
        <option value="image">图片</option>
        <option value="pdf">PDF</option>
        <option value="text">文本</option>
      </select>
      <select id="fstate">
        <option value="">全部状态</option>
        <option value="pending">待解析</option>
        <option value="parsing">解析中</option>
        <option value="to_extract">待抽取</option>
        <option value="to_review">待校验</option>
        <option value="to_load">待入库</option>
        <option value="loading">入库中</option>
        <option value="loaded">已入库</option>
        <option value="failed">失败</option>
      </select>
      <button type="button" class="btn" id="upbtn">上传登记</button>
      <input type="file" id="picker" hidden
        accept=".png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff,.pdf,.csv,.txt,.md">
    </div>
  </div>
  <div class="banner warn" id="degraded" hidden>
    平台库未连接，资料目录暂不可用。解析页上传的文件仍会自动留档，连接恢复后可重新上传完成登记。
  </div>
  <div class="banner info" id="upmsg" hidden></div>
  <div class="panel">
    <table class="list">
      <thead><tr>
        <th class="seq">序号</th><th>资料ID</th><th>文件名</th><th>类型</th><th>大小</th>
        <th>状态</th><th>抽取规则</th><th>sha256</th><th>标签</th><th>上传时间</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <b>暂无已登记的文件</b>
      可点击右上角「上传登记」，或在解析页上传文件，系统将自动登记到这里。
    </div>
    <div class="pager" id="pager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
</div>
<div class="lightbox" id="lb" hidden>
  <button type="button" class="lbclose">关闭 (Esc)</button>
  <img alt="预览">
</div>
<div class="drawer" id="receipt" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="rctitle">入库回执</h2>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="rcclose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="rcbody"></div>
  </div>
</div>
<div class="drawer" id="cfg" hidden>
  <div class="dpanel pipe-panel">
    <div class="dhead">
      <h2 id="cfgTitle">资料配置</h2>
      <span class="spacer"></span>
      <span class="msg" id="cfgMsg"></span>
      <button type="button" class="btn mini" id="cfgSave" hidden>保存配置</button>
      <button type="button" class="dclose" id="cfgClose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="cfgBody"></div>
  </div>
</div>
<div class="drawer" id="pipe" hidden>
  <div class="dpanel pipe-panel">
    <div class="dhead">
      <h2 id="pipeTitle">资料详情</h2>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="pipeClose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="pipeBody"></div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/hint.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/sources.js"></script>
</body>
</html>
