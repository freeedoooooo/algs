<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>解析 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/parse.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse" class="on">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <a href="/governance">治理</a>
  <a href="/compute">计算</a>
  <span class="spacer"></span>
  <span class="navnote">上传文件，生成结构化记录</span>
</nav>
<div class="app">
  <aside class="console">
    <div id="drop">
      <b>点击或拖拽文件到此处</b>
      支持 pdf / csv / png / jpg / bmp / webp / txt / md，单个文件不超过 20MB。
    </div>
    <input type="file" id="picker"
      accept=".png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff,.pdf,.csv,.txt,.md">
    <ul class="files" id="filelist"></ul>
    <div class="filebar" id="filebar" hidden>
      <span id="filecount"></span>
    </div>
    <div class="row">
      <button type="button" class="btn" id="go" disabled>开始解析</button>
      <span class="hint" tabindex="0" data-tip="首次加载模型约需 20~40 秒，后续任务复用模型，速度更快。">?</span>
      <span id="msg"></span>
    </div>
    <details class="params" id="parampanel" open>
      <summary class="params-head">
        <span class="params-title">参数</span>
        <span class="pbadge" id="parambadge">默认</span>
        <span class="hint" tabindex="0" onclick="event.preventDefault()"
              data-tip="参数按重要程度排序，通常保持默认值即可；&#10;修改仅对本次上传生效。">?</span>
        <span class="spacer"></span>
        <button type="button" class="btn ghost mini" id="resetparams">恢复默认</button>
      </summary>
      <div class="param-groups" id="paramgroups"></div>
    </details>
  </aside>
  <div class="gutter" id="gutter" tabindex="0" data-tip="拖动调整左栏宽度&#10;双击恢复默认"></div>
  <main class="reportcol">
    <div class="reportempty" id="reportempty">
      <div class="re-inner">
        <b>对照报告将显示在这里</b>
        <span>选择文件后点击「开始解析」，生成对照报告。</span>
      </div>
    </div>
    <div class="runpanel" id="runpanel" hidden>
      <div class="runcard">
        <div class="runbar">
          <span id="runstage">准备中…</span>
          <span class="spacer"></span>
          <span id="runpct">0%</span>
          <a class="mini-link" id="stglink" hidden>预览解析结果</a>
          <a class="mini-link" id="dlLog" href="/api/logs" target="_blank">下载日志</a>
          <button type="button" class="mini-link" id="logclose" hidden>关闭</button>
        </div>
        <div class="track"><div class="fill" id="runfill"></div></div>
        <div class="logbox" id="log"></div>
      </div>
    </div>
    <div class="histbar" id="histbar" hidden>
      <label for="histsel">资料选择</label>
      <select id="histsel"></select>
      <button type="button" class="btn mini" id="histParse" disabled>执行解析</button>
      <span class="hist-msg" id="histParseMsg"></span>
    </div>
    <div class="unparsed" id="unparsed" hidden>
      <div class="up-inner">
        <b id="upTitle">该资料尚未解析</b>
        <span id="upDesc">此资料已登记，但还没有对照报告。点击上方「执行解析」按钮发起解析，完成后自动生成报告。</span>
      </div>
    </div>
    <div class="filetabs" id="filetabs" hidden></div>
    <iframe id="reportFrame" class="reportframe" hidden title="对照报告"></iframe>
    <button type="button" class="btn ghost mini logbtn" id="logbtn" hidden>查看日志</button>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden>
  <div class="lbtop">
    <button type="button" id="lbPick">取 x 坐标</button>
    <span class="hint" tabindex="0" data-tip="坐标取自原图像素。&#10;适用于 doc_unwarp 关闭（off）的情况。">?</span>
    <button type="button" id="lbZoom">1:1 像素</button>
    <span class="spacer"></span>
    <button type="button" id="lbClose">关闭 (Esc)</button>
  </div>
  <div class="lbstage" id="lbStage">
    <div class="lbwrap" id="lbwrap">
      <img id="lbimg" alt="预览">
      <svg id="lbsvg" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div class="pickbar" id="pickbar" hidden>
    <span class="picklabel">点击图片取 x 坐标</span>
    <span class="pickvals" id="pickvals"></span>
    <button type="button" data-pick="fill">填入列边界</button>
    <button type="button" data-pick="copy">复制</button>
    <button type="button" data-pick="clear">清空</button>
    <button type="button" data-pick="exit">退出取数</button>
  </div>
</div>
<script src="/static/hint.js"></script>
<script src="/static/shell.js"></script>
<script src="/static/parse.js"></script>
</body>
</html>
