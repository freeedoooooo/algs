<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校验台 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/stage.css">
<link rel="stylesheet" href="/static/review.css">
<link rel="stylesheet" href="/static/wizard.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化平台</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review" class="on">校验</a>
  <a href="/rules">入库</a>
  <a href="/tasks">任务</a>
  <span class="spacer"></span>
  <span class="navnote">逐条核对与确认记录</span>
</nav>
<div class="pagebody wide">
  <div class="pagehead">
    <h1>校验台</h1>
    <span class="mono" id="tasktag"></span>
    <span id="tplbadge"></span>
    <span class="spacer"></span>
    <div class="toolbar" id="ledgerbar" hidden>
      <input type="search" id="lq" placeholder="搜索任务 id / 文件名 / 抽取规则…">
      <select id="lprog">
        <option value="">全部进度</option>
        <option value="todo">有待校验</option>
        <option value="edited">有已修改</option>
        <option value="done">校验完</option>
      </select>
    </div>
    <span id="filelinks"></span>
    <button type="button" class="btn mini" id="loadbtn" hidden>入库</button>
    <button type="button" class="btn ghost mini" id="rcbtn" hidden>回执 / 隔离</button>
    <a class="btn ghost mini" id="tasklink" href="/tasks">返回</a>
  </div>
  <div class="banner info" id="modebanner">双击单元格修改取值，记录自动转为「已修改」；✓ 确认 · ✗ 拒绝；单击或悬停可查看血缘回溯；悬停列名/数据格/回溯框看字段映射</div>
  <div class="banner err" id="err" hidden></div>
  <div class="panel" id="taskpick" hidden>
    <div class="listwrap ledgerwrap">
      <table class="list" id="ledger" hidden>
        <thead><tr>
          <th class="seq">序号</th><th>任务ID</th><th>资料</th><th>抽取规则</th><th class="num">记录</th>
          <th class="num">待校验</th><th class="num">已修改</th>
          <th class="num">已确认</th><th class="num">已拒绝</th>
          <th>状态</th><th>时间</th>
        </tr></thead>
        <tbody id="ledgerrows"></tbody>
      </table>
    </div>
    <div class="empty" id="ledgerempty" hidden><b>暂无可校验的记录</b>请先到「解析」页上传文件。</div>
    <div class="pager" id="ledpager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
  <div class="filetabs" id="filetabs" hidden></div>
  <div class="reviewbar" id="reviewbar" hidden>
    <div class="chips" id="chips"></div>
    <span class="spacer"></span>
    <button type="button" class="btn mini" id="bulk-confirm">确认全部待审 (0)</button>
  </div>
  <div class="stgwrap">
    <div class="panel stgmain">
      <table class="list" id="rectable">
        <thead id="rechead"></thead>
        <tbody id="recrows"></tbody>
      </table>
      <div class="empty" id="empty" hidden><b>暂无解析记录</b>该文件未解析出表格数据。</div>
    </div>
    <aside class="panel lineage" id="lineage" hidden>
      <div class="lhead">
        <b id="ltitle">血缘回溯</b>
        <span class="lsub" id="lsub"></span>
        <button type="button" class="btn ghost mini ltoggle" id="ltoggle"
                aria-expanded="true" title="收起血缘回溯">›</button>
      </div>
      <div class="stage" id="lstage">
        <div class="pager" id="lpager" data-pages="" hidden>
          <button type="button" class="pg-btn" data-pg="first" title="第一页">«</button>
          <button type="button" class="pg-btn" data-pg="prev" title="上一页">‹</button>
          <span class="pg-nums"></span>
          <button type="button" class="pg-btn" data-pg="next" title="下一页">›</button>
          <button type="button" class="pg-btn" data-pg="last" title="最后一页">»</button>
          <span class="pg-count"><input class="pg-jump" type="text" inputmode="numeric"
            value="1" title="输入页码，回车跳转"><i>/</i><b id="pgtotal">1</b></span>
        </div>
        <div class="viewbar" id="viewbar"></div>
        <div class="views" id="views"></div>
        <div class="lhint" id="lhint" hidden></div>
      </div>
    </aside>
  </div>
  <div class="msg" id="summary" style="margin-top:10px"></div>
</div>
<div class="lightbox" id="lightbox" hidden>
  <div class="lb-bar">
    <span class="lb-title" id="lbTitle">图片查看</span>
    <button type="button" data-lb="out">− 缩小</button>
    <span class="lb-scale" id="lbScale">100%</span>
    <button type="button" data-lb="in">＋ 放大</button>
    <button type="button" data-lb="fit">适应窗口</button>
    <button type="button" data-lb="one">1:1 原始像素</button>
    <button type="button" data-lb="boxes" id="lbBoxes">显示叠加框</button>
    <a id="lbOpen" href="#" target="_blank">新窗口打开原图</a>
    <button type="button" data-lb="close">关闭 (Esc)</button>
  </div>
  <div class="lb-stage" id="lbStage"><div class="lb-content" id="lbContent"></div></div>
  <div class="lb-hint">滚轮缩放 · 按住拖拽平移 · 双击切换 1:1 / 适应窗口 · 单击回溯框定位记录 · Esc 关闭</div>
</div>
<div class="drawer" id="receipt" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="rctitle">入库回执</h2>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="rcclose">关闭 (Esc)</button>
    </div>
    <div class="dbody" id="rcbody"></div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/wizard.js"></script>
<script src="/static/stage.js"></script>
<script src="/static/review.js"></script>
</body>
</html>
