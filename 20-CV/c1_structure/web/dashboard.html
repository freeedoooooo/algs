<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化平台</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules" class="on">入库</a>
  <a href="/tasks">任务</a>
  <span class="spacer"></span>
  <span class="navnote">业务表数据 · 血缘回溯</span>
</nav>
<div class="pagebody wide">
  <div class="pagehead">
    <h1>数据看板</h1>
    <span class="mono" id="tabletag"></span>
    <span class="spacer"></span>
    <a class="btn ghost mini" id="backlink" href="/rules">返回入库规则</a>
  </div>
  <div class="banner info" id="hint">分页查看业务表数据；点击任意一行，在右侧查看该记录的血缘回溯。无溯源信息或反查失败会明确提示。</div>
  <div class="banner err" id="err" hidden></div>
  <div class="dashsplit">
  <div class="panel dashmain">
    <div class="toolbar">
      <label class="flab" for="perpage">每页</label>
      <select class="tin" id="perpage" style="width:auto">
        <option>50</option><option selected>100</option><option>200</option>
      </select>
      <span class="spacer"></span>
      <span class="mono" id="total"></span>
    </div>
    <div class="listwrap" id="wrap">
      <table class="list" id="rows" hidden>
        <thead><tr id="rowhead"></tr></thead>
        <tbody id="rowbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden><b>该表暂无数据</b></div>
    </div>
    <div class="pager" id="pager" hidden>
      <button type="button" class="pgprev" id="pgprev">上一页</button>
      <span class="pginfo" id="pginfo"></span>
      <button type="button" class="pgnext" id="pgnext">下一页</button>
    </div>
  </div>
  <aside class="dashlineage" id="lineagepanel" hidden>
    <div class="linemsg" id="linemsg" hidden></div>
    <iframe id="linframe" title="血缘回溯" hidden></iframe>
  </aside>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
