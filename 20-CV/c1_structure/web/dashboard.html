<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验规则</a>
  <a href="/rules" class="on">入库</a>
  <span class="spacer"></span>
  <span class="navnote">业务表数据 · 血缘回溯</span>
</nav>
<div class="pagebody wide">
  <div class="pagehead">
    <h1>数据看板</h1>
    <span class="mono" id="tabletag"></span>
    <span class="spacer"></span>
    <a class="btn ghost mini" id="backlink" href="/rules">返回入库映射</a>
  </div>
  <div class="banner info" id="hint">默认按资料文件筛选，只显示所选资料写入的数据；选择「全部资料」查看整张表。点击任意一行，在右侧查看该记录的血缘回溯。</div>
  <div class="banner err" id="err" hidden></div>
  <div class="dashsplit">
  <div class="panel dashmain">
    <div class="toolbar">
      <label class="flab" for="filesel">资料文件</label>
      <select class="tin" id="filesel" style="width:auto;max-width:280px">
        <option value="">全部资料</option>
      </select>
      <span class="spacer"></span>
      <span class="mono" id="total"></span>
    </div>
    <div class="listwrap" id="wrap">
      <table class="list" id="rows" hidden>
        <thead><tr id="rowhead"></tr></thead>
        <tbody id="rowbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden><b>该表暂无数据</b></div>
    </div>
    <div class="pager" id="pager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
  <aside class="dashlineage" id="lineagepanel" hidden>
    <div class="linemsg" id="linemsg" hidden></div>
    <iframe id="linframe" title="血缘回溯" hidden></iframe>
  </aside>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
