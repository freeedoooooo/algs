<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/compute.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <a href="/compute" class="on">计算</a>
  <span class="spacer"></span>
  <span class="navnote">指标 · 规则 · 框架 · 全路径追溯</span>
</nav>
<div class="pagebody compute-page">
  <div class="banner err" id="err" hidden></div>
  <div class="banner info" id="ok" hidden></div>
  <div class="compute-workspace">
    <aside class="asset-library" aria-label="计算定义资产">
      <section class="asset-section disclosure-section" data-scope="source">
        <div class="disclosure">
          <div class="disclosure__head asset-title">
            <span class="disclosure__title"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="3.5" rx="5.5" ry="2.2"/><path d="M2.5 3.5v4c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-4M2.5 7.5v4c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2v-4"/></svg>数据</span>
            <span class="disclosure__meta" id="d-count">0</span>
            <span class="asset-title-spacer"></span>
            <button type="button" class="disclosure__toggle" data-disclosure-toggle data-disclosure-key="compute.data"
              aria-controls="d-assets" aria-expanded="true" aria-label="折叠数据"><span class="disclosure__chevron"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></span></button>
          </div>
          <div class="disclosure__body asset-list" id="d-assets"></div>
        </div>
      </section>
      <section class="asset-section disclosure-section" data-scope="index">
        <div class="disclosure">
          <div class="disclosure__head asset-title">
            <span class="disclosure__title"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13V8M6 13V3M10 13V6M14 13V1"/></svg>指标</span>
            <span class="disclosure__meta" id="i-count">0</span>
            <button type="button" class="icon-btn" id="i-new" data-tip="新建指标" aria-label="新建指标"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
            <button type="button" class="disclosure__toggle" data-disclosure-toggle data-disclosure-key="compute.index"
              aria-controls="i-assets" aria-expanded="true" aria-label="折叠指标"><span class="disclosure__chevron"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></span></button>
          </div>
          <div class="disclosure__body asset-list" id="i-assets"></div>
        </div>
      </section>
      <section class="asset-section disclosure-section" data-scope="rule">
        <div class="disclosure">
          <div class="disclosure__head asset-title">
            <span class="disclosure__title"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h10M3 8h10M3 14h10"/><circle cx="6" cy="2" r="1.5" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1.5" fill="currentColor" stroke="none"/><circle cx="6" cy="14" r="1.5" fill="currentColor" stroke="none"/></svg>规则</span>
            <span class="disclosure__meta" id="r-count">0</span>
            <button type="button" class="icon-btn" id="r-new" data-tip="新建规则" aria-label="新建规则"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
            <button type="button" class="disclosure__toggle" data-disclosure-toggle data-disclosure-key="compute.rule"
              aria-controls="r-assets" aria-expanded="true" aria-label="折叠规则"><span class="disclosure__chevron"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></span></button>
          </div>
          <div class="disclosure__body asset-list" id="r-assets"></div>
        </div>
      </section>
      <section class="asset-section disclosure-section" data-scope="frame">
        <div class="disclosure">
          <div class="disclosure__head asset-title">
            <span class="disclosure__title"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2 6 3-6 3-6-3 6-3ZM2 8l6 3 6-3M2 12l6 3 6-3"/></svg>框架</span>
            <span class="disclosure__meta" id="f-count">0</span>
            <button type="button" class="icon-btn" id="f-new" data-tip="新建框架" aria-label="新建框架"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
            <button type="button" class="disclosure__toggle" data-disclosure-toggle data-disclosure-key="compute.frame"
              aria-controls="f-assets" aria-expanded="true" aria-label="折叠框架"><span class="disclosure__chevron"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg></span></button>
          </div>
          <div class="disclosure__body asset-list" id="f-assets"></div>
        </div>
      </section>
    </aside>
    <div class="asset-divider" id="assetDivider" title="拖动调整侧栏宽度">
      <button type="button" class="asset-collapse" id="assetCollapse" aria-label="收起计算资产栏" aria-expanded="true" title="收起侧栏">‹</button>
    </div>
    <section class="graph-panel" aria-label="计算流程配置区">
      <div class="graph-head">
        <div class="graph-title"><b>血缘图</b><span class="hint" tabindex="0" data-tip="单击节点查看详情；双击节点血缘追溯；拖动节点调整布局；从节点右侧端口拖出连线。&#10;空白处拖动平移，滚轮缩放。">?</span></div>
        <span class="spacer"></span>
        <div class="graph-tools">
          <button type="button" class="btn mini" id="graph-run-all">重新计算</button>
          <button type="button" class="btn mini" id="layout-save" data-tip="将当前血缘图位置保存到数据库">保存布局</button>
          <button type="button" class="icon-btn" id="zoom-out" data-tip="缩小" aria-label="缩小">−</button>
          <span id="zoom-label">100%</span>
          <button type="button" class="icon-btn" id="zoom-in" data-tip="放大" aria-label="放大">＋</button>
          <button type="button" class="icon-btn" id="graph-fit" data-tip="适应画布" aria-label="适应画布"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><rect x="5" y="5" width="6" height="6" rx="1"/></svg></button>
          <button type="button" class="icon-btn" id="graph-auto" data-tip="自动排布" aria-label="自动排布"><svg class="scope-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx="1"/><rect x="10" y="2" width="4" height="4" rx="1"/><rect x="2" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><path d="M6 4h4M4 6v4M12 6v4M6 12h4"/></svg></button>
          <button type="button" class="icon-btn" id="edge-del" data-tip="断开选中连线" aria-label="断开选中连线" hidden>×</button>
        </div>
      </div>
      <div class="graph-canvas" id="graph-canvas" tabindex="0" aria-label="可拖动、缩放的血缘图">
        <div class="graph-legend" aria-label="血缘图图例">
          <span class="legend-item"><i class="legend-dot document"></i>资料</span>
          <span class="legend-item"><i class="legend-dot source"></i>数据表</span>
          <span class="legend-item"><i class="legend-dot index"></i>指标</span>
          <span class="legend-item"><i class="legend-dot rule"></i>规则</span>
          <span class="legend-item"><i class="legend-dot frame"></i>框架</span>
          <span class="legend-sep"></span>
          <span class="legend-item"><i class="legend-dot pass"></i>通过</span>
          <span class="legend-item"><i class="legend-dot fail"></i>未通过</span>
        </div>
        <div class="graph-world" id="graph-world">
          <svg class="graph-edges" id="graph-edges" aria-hidden="true"></svg>
          <div class="graph-nodes" id="graph-nodes"></div>
        </div>
        <div class="graph-empty" id="graph-empty" hidden><b>暂无流程节点</b></div>
      </div>
    </section>
  </div>
</div>
<div class="action-menu compute-action-menu" id="compute-action-menu" role="menu" hidden></div>

<div class="drawer wide lineage-drawer" id="lineage" aria-label="血缘追溯工作台" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="lineage-title">血缘追溯</h2><span class="tag" id="lineage-tag"></span>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="lineage-close">关闭 (Esc)</button>
    </div>
    <div class="dbody lineage-body">
      <section class="lineage-mini-panel">
        <div class="lineage-mini-head"><b>血缘图</b></div>
        <div class="graph-canvas lineage-mini-canvas" id="lineage-graph" tabindex="0" aria-label="血缘追溯血缘图">
          <div class="graph-world" id="lineage-world"><svg class="graph-edges" id="lineage-edges" aria-hidden="true"></svg><div class="graph-nodes" id="lineage-nodes"></div></div>
          <div class="graph-empty" id="lineage-empty" hidden><b>没有可展示的节点</b></div>
        </div>
      </section>
      <div class="lineage-mobile-tabs" role="tablist" aria-label="追溯内容">
        <button type="button" class="btn mini ghost is-active" data-lineage-tab="current" role="tab" aria-selected="true">当前节点</button>
        <button type="button" class="btn mini ghost" data-lineage-tab="upstream" role="tab" aria-selected="false"><span id="lineage-related-tab">上游节点</span></button>
      </div>
      <div class="lineage-detail-grid">
        <section class="lineage-panel lineage-current-panel lineage-mobile-active" id="lineage-current-panel">
          <div class="section-head"><b>当前节点</b><span class="spacer"></span><a id="lineage-open-source" href="#" target="_blank" rel="noopener" hidden>打开原件</a></div>
          <div class="lineage-current" id="lineage-current"></div>
          <iframe id="lineage-document-frame" title="资料文件预览" hidden></iframe>
        </section>
        <section class="lineage-panel lineage-upstream-panel" id="lineage-upstream-panel">
          <div class="section-head"><b id="lineage-related-title">上游节点</b></div>
          <div class="lineage-upstream" id="lineage-upstream"></div>
        </section>
      </div>
    </div>
  </div>
</div>

<!-- 定义编辑抽屉（三模块复用） -->
<div class="drawer wide" id="ded" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="de-title">新建定义</h2><span class="spacer"></span>
      <button type="button" class="dclose" id="de-close">关闭 (Esc)</button>
    </div>
    <div class="dbody">
      <div id="de-index" hidden>
        <div class="fsec"><label class="flab" for="i-name">名称</label>
          <input type="text" class="tin" id="i-name" placeholder="如：金额合计"></div>
        <div class="fsec"><label class="flab" for="i-ds">业务库</label>
          <select class="tin" id="i-ds"><option value="">加载中…</option></select></div>
        <div class="fsec"><label class="flab" for="i-table">业务表</label>
          <select class="tin" id="i-table"><option value="">先选业务库</option></select></div>
        <div class="fsec"><label class="flab" for="i-column">聚合列（计数可留空）</label>
          <select class="tin" id="i-column"><option value="">先选业务表</option></select></div>
        <div class="fsec"><label class="flab" for="i-agg">运算</label>
          <select class="tin" id="i-agg">
            <option value="sum">求和</option><option value="count">计数</option>
            <option value="avg">平均</option><option value="min">最小值</option>
            <option value="max">最大值</option><option value="count_distinct">去重计数</option>
          </select></div>
        <div class="fsec"><label class="flab">筛选条件（可选）</label>
          <div id="i-filters"></div>
          <button type="button" class="btn mini ghost" id="i-addfilter" style="margin-top:4px">＋ 添加条件</button></div>
      </div>
      <div id="de-rule" hidden>
        <div class="fsec"><label class="flab" for="r-name">名称</label>
          <input type="text" class="tin" id="r-name" placeholder="如：金额超阈值"></div>
        <div class="fsec"><label class="flab">引用指标与条件（每行一个指标条件）</label>
          <div class="condition-head"><span>指标</span><span>标识名</span><span>比较</span><span>阈值</span><span></span></div>
          <div id="r-conditions"></div>
          <button type="button" class="btn mini ghost" id="r-addcondition" style="margin-top:6px">＋ 添加条件</button></div>
        <div class="fsec"><label class="flab" for="r-combine">条件组合</label>
          <select class="tin" id="r-combine"><option value="all">全部满足</option><option value="any">任一满足</option></select></div>
      </div>
      <div id="de-frame" hidden>
        <div class="fsec"><label class="flab" for="f-name">名称</label>
          <input type="text" class="tin" id="f-name" placeholder="如：综合评估"></div>
        <div class="fsec"><label class="flab">关联规则（勾选并设置权重）</label>
          <div id="f-rules" class="rulechecks"></div></div>
        <div class="fsec"><label class="flab" for="f-combine">组合方式</label>
          <select class="tin" id="f-combine">
            <option value="weighted">加权得分</option><option value="all_pass">全部通过</option>
            <option value="any_pass">任一通过</option><option value="veto">一票否决</option>
          </select></div>
        <div class="fsec"><label class="flab" for="f-th">通过阈值（加权模式）</label>
          <input type="text" class="tin" id="f-th" value="0.8"></div>
      </div>
    </div>
    <div class="dfoot"><span class="msg" id="de-msg"></span><span class="spacer"></span>
      <button type="button" class="btn" id="de-save">保存</button></div>
  </div>
</div>

<div class="drawer wide" id="compute-view" hidden>
  <div class="dpanel"><div class="dhead"><h2 id="view-title">查看定义</h2><span class="spacer"></span>
    <button type="button" class="dclose" id="view-close">关闭 (Esc)</button></div>
    <div class="dbody" id="view-body"></div></div>
</div>

<div class="drawer wide" id="trace" hidden>
  <div class="dpanel">
    <div class="dhead"><h2 id="tr-title">结果复核</h2><span class="spacer"></span>
      <button type="button" class="dclose" id="tr-close">关闭 (Esc)</button></div>
    <div class="dbody" id="tr-body"><div class="empty">加载中…</div></div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/hint.js"></script>
<script src="/static/compute_graph.js"></script>
<script src="/static/compute.js"></script>
</body>
</html>
