<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/compute.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <a href="/compute" class="on">计算</a>
  <span class="spacer"></span>
  <span class="navnote">指标 · 规则 · 框架 · 全路径追溯</span>
</nav>
<div class="pagebody compute-page">
  <div class="banner err" id="err" hidden></div>
  <div class="banner info" id="ok" hidden></div>
  <div class="compute-workspace">
    <aside class="asset-library" aria-label="计算定义资产">
      <div class="library-head"><b>计算资产</b><span>新增、查看与运行</span></div>
      <section class="asset-section" data-scope="index">
        <div class="asset-title"><span class="scope-dot index"></span><b>指标</b><span class="spacer"></span>
          <button type="button" class="btn mini" id="i-new">＋ 新建</button></div>
        <div class="asset-list" id="i-assets"></div>
      </section>
      <section class="asset-section" data-scope="rule">
        <div class="asset-title"><span class="scope-dot rule"></span><b>规则</b><span class="spacer"></span>
          <button type="button" class="btn mini" id="r-new">＋ 新建</button></div>
        <div class="asset-list" id="r-assets"></div>
      </section>
      <section class="asset-section" data-scope="frame">
        <div class="asset-title"><span class="scope-dot frame"></span><b>框架</b><span class="spacer"></span>
          <button type="button" class="btn mini" id="f-new">＋ 新建</button></div>
        <div class="asset-list" id="f-assets"></div>
      </section>
    </aside>
    <section class="graph-panel" aria-label="计算流程图配置区">
      <div class="graph-head">
        <div><b>流程图配置</b><span class="graph-sub">拖动节点排布，从右侧端口连线到下级节点</span></div>
        <span class="spacer"></span>
        <span class="save-state" id="layout-state">布局读取中…</span>
        <div class="graph-tools">
          <button type="button" class="btn mini ghost" id="zoom-out" title="缩小">−</button>
          <span id="zoom-label">100%</span>
          <button type="button" class="btn mini ghost" id="zoom-in" title="放大">＋</button>
          <button type="button" class="btn mini ghost" id="graph-fit">适应</button>
          <button type="button" class="btn mini ghost" id="graph-auto">自动排布</button>
          <button type="button" class="btn mini ghost danger" id="edge-del" hidden>断开连线</button>
        </div>
      </div>
      <div class="graph-canvas" id="graph-canvas" tabindex="0" aria-label="可拖动、缩放的计算流程图">
        <div class="graph-world" id="graph-world">
          <svg class="graph-edges" id="graph-edges" aria-hidden="true"></svg>
          <div class="graph-nodes" id="graph-nodes"></div>
        </div>
        <div class="graph-empty" id="graph-empty" hidden><b>还没有可配置的节点</b>先在左侧新建指标，再逐级建立规则与框架。</div>
        <div class="graph-hint">空白处拖动平移 · 滚轮缩放 · 点击连线后可断开 · Delete 删除选中连线</div>
      </div>
    </section>
  </div>
</div>

<!-- 定义编辑抽屉（三模块复用） -->
<div class="drawer wide" id="ded" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="de-title">新建定义</h2><span class="spacer"></span>
      <button type="button" class="dclose" id="de-close">关闭 (Esc)</button>
    </div>
    <div class="dbody">
      <div id="de-index" hidden>
        <div class="fsec"><label class="flab" for="i-name">名称</label>
          <input type="text" class="tin" id="i-name" placeholder="如：金额合计"></div>
        <div class="fsec"><label class="flab" for="i-ds">业务库</label>
          <select class="tin" id="i-ds"><option value="">加载中…</option></select></div>
        <div class="fsec"><label class="flab" for="i-table">业务表</label>
          <select class="tin" id="i-table"><option value="">先选业务库</option></select></div>
        <div class="fsec"><label class="flab" for="i-column">聚合列（计数可留空）</label>
          <select class="tin" id="i-column"><option value="">先选业务表</option></select></div>
        <div class="fsec"><label class="flab" for="i-agg">运算</label>
          <select class="tin" id="i-agg">
            <option value="sum">求和</option><option value="count">计数</option>
            <option value="avg">平均</option><option value="min">最小值</option>
            <option value="max">最大值</option><option value="count_distinct">去重计数</option>
          </select></div>
        <div class="fsec"><label class="flab">筛选条件（可选）</label>
          <div id="i-filters"></div>
          <button type="button" class="btn mini ghost" id="i-addfilter" style="margin-top:4px">＋ 添加条件</button></div>
      </div>
      <div id="de-rule" hidden>
        <div class="fsec"><label class="flab" for="r-name">名称</label>
          <input type="text" class="tin" id="r-name" placeholder="如：金额超阈值"></div>
        <div class="fsec"><label class="flab">引用指标与条件（每行一个指标条件）</label>
          <div class="condition-head"><span>指标</span><span>标识名</span><span>比较</span><span>阈值</span><span></span></div>
          <div id="r-conditions"></div>
          <button type="button" class="btn mini ghost" id="r-addcondition" style="margin-top:6px">＋ 添加条件</button>
          <div class="sthint">between 区间阈值用逗号分隔，如 100,200。</div></div>
        <div class="fsec"><label class="flab" for="r-combine">条件组合</label>
          <select class="tin" id="r-combine"><option value="all">全部满足</option><option value="any">任一满足</option></select></div>
      </div>
      <div id="de-frame" hidden>
        <div class="fsec"><label class="flab" for="f-name">名称</label>
          <input type="text" class="tin" id="f-name" placeholder="如：综合评估"></div>
        <div class="fsec"><label class="flab">关联规则（勾选并设置权重）</label>
          <div id="f-rules" class="rulechecks"></div></div>
        <div class="fsec"><label class="flab" for="f-combine">组合方式</label>
          <select class="tin" id="f-combine">
            <option value="weighted">加权得分</option><option value="all_pass">全部通过</option>
            <option value="any_pass">任一通过</option><option value="veto">一票否决</option>
          </select></div>
        <div class="fsec"><label class="flab" for="f-th">通过阈值（加权模式）</label>
          <input type="text" class="tin" id="f-th" value="0.8"></div>
      </div>
    </div>
    <div class="dfoot"><span class="msg" id="de-msg"></span><span class="spacer"></span>
      <button type="button" class="btn" id="de-save">保存</button></div>
  </div>
</div>

<div class="drawer" id="compute-view" hidden>
  <div class="dpanel"><div class="dhead"><h2 id="view-title">查看定义</h2><span class="spacer"></span>
    <button type="button" class="dclose" id="view-close">关闭 (Esc)</button></div>
    <div class="dbody" id="view-body"></div></div>
</div>

<div class="drawer" id="trace" hidden>
  <div class="dpanel">
    <div class="dhead"><h2 id="tr-title">全链路追溯</h2><span class="spacer"></span>
      <button type="button" class="dclose" id="tr-close">关闭 (Esc)</button></div>
    <div class="dbody" id="tr-body"><div class="empty">加载中…</div></div>
  </div>
</div>

<script src="/static/shell.js"></script>
<script src="/static/compute_graph.js"></script>
<script src="/static/compute.js"></script>
</body>
</html>
