<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽取规则 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/extract.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化平台</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract" class="on">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <a href="/tasks">任务</a>
  <span class="spacer"></span>
  <span class="navnote">配置从文件抽取字段的规则</span>
</nav>
<div class="pagebody">
  <div class="pagehead">
    <h1>抽取规则</h1>
    <span class="sub">抽取规则定义文件的读取方式，产出一组规范字段；字段写入哪个库表在「入库」页配置</span>
    <span class="spacer"></span>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索规则名 / 说明…">
      <button type="button" class="btn" id="newbtn">新建规则</button>
    </div>
  </div>
  <div class="banner err" id="err" hidden></div>
  <div class="banner info" id="ok" hidden></div>
  <div class="panel">
    <table class="list">
      <thead><tr>
        <th class="seq">序号</th><th>规则ID</th><th>规则名</th><th>说明</th><th>当前版本</th><th>版本数</th>
        <th>更新时间</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
</div>
<div class="drawer wide" id="edit" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="etitle">新建规则</h2>
      <span id="everbadge"></span>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="eclose">关闭 (Esc)</button>
    </div>
    <div class="dbody">
      <div class="fsec">
        <label class="flab" for="ename">规则名</label>
        <input type="text" class="tin" id="ename" placeholder="如：银行流水 · 明细字段">
      </div>
      <div class="fsec">
        <label class="flab" for="edesc">说明</label>
        <input type="text" class="tin" id="edesc" placeholder="用途 / 适用文件…">
      </div>
      <div class="fsec">
        <label class="flab" for="refsel">参考文件
          <span class="hint" tabindex="0" data-tip="选择一个已预览任务的文件，系统列出它的候选源表与源列，方便下方选表选列。不选择也可以，改为手动填写源表。">?</span>
        </label>
        <select class="tin" id="refsel">
          <option value="">不使用参考（手动填写源表）</option>
        </select>
        <div class="sthint" id="refhint"></div>
      </div>
      <div class="fsec">
        <label class="flab" for="tblsel">源表
          <span class="hint" tabindex="0" data-tip="每个规则版本对应一张源表。&#10;序号即候选表顺序：各页非合并表在前，跨页合并表在后。&#10;未选参考文件时，可手动填表序号或表头关键词（取第一张匹配表）。">?</span>
        </label>
        <select class="tin" id="tblsel" disabled>
          <option value="">—</option>
        </select>
        <span id="tmanual">
          <input type="number" class="tin tidx" id="tindex" min="0" placeholder="表序号">
          <input type="text" class="tin tkw" id="tkw" placeholder="或表头关键词（取第一张匹配表）">
        </span>
      </div>
      <div class="fsec">
        <label class="flab">字段定义
          <span class="hint" tabindex="0" data-tip="选定源列，给它起目标字段名（即记录键，入库规则按它对齐目标列）。&#10;源列可按列名或列序号指定；转换在入库时生效，暂存值保持不变。&#10;每次保存生成新的不可变版本，旧任务不受影响。">?</span>
        </label>
        <div class="frow fhead" aria-hidden="true">
          <span class="fcol">原始列名</span>
          <span class="fidx" hidden></span>
          <span class="fname">目标字段名</span>
          <span class="fxform">转换</span>
          <span class="fdest">入库去向</span>
          <span class="fdel"></span>
        </div>
        <div id="frows"></div>
        <button type="button" class="btn mini ghost" id="addfield">＋添加字段</button>
      </div>
      <div class="fsec" id="versec" hidden>
        <label class="flab">版本历史</label>
        <div id="verlist"></div>
      </div>
    </div>
    <div class="dfoot">
      <span class="msg" id="emsg"></span>
      <span class="spacer"></span>
      <button type="button" class="btn danger" id="delbtn" hidden>删除规则</button>
      <button type="button" class="btn" id="savebtn">保存为新版本</button>
    </div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/hint.js"></script>
<script src="/static/extract.js"></script>
</body>
</html>
