<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽取规则 · 结构化工具</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/extract.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<nav class="topnav">
  <a class="brand" href="/">结构化工具</a>
  <a href="/">工作台</a>
  <a href="/sources">资料</a>
  <a href="/parse">解析</a>
  <a href="/extract" class="on">抽取</a>
  <a href="/review">校验</a>
  <a href="/rules">入库</a>
  <span class="spacer"></span>
  <span class="navnote">配置从文件抽取字段的规则</span>
</nav>
<div class="pagebody">
  <div class="pagehead">
    <h1>抽取规则</h1>
    <span class="hint" tabindex="0" data-tip="抽取规则定义文件的读取方式，产出一组规范字段。&#10;字段写入哪个库表在「入库」页配置。">?</span>
    <span class="spacer"></span>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索规则名 / 说明…">
      <button type="button" class="btn" id="newbtn">新建规则</button>
    </div>
  </div>
  <div class="banner err" id="err" hidden></div>
  <div class="banner info" id="ok" hidden></div>
  <div class="panel">
    <table class="list">
      <thead><tr>
        <th class="seq">序号</th><th>规则ID</th><th>规则名</th><th>说明</th><th>当前版本</th><th>版本数</th>
        <th>更新时间</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager" id="pager" hidden>
      <span class="pginfo"></span>
      <button type="button" class="pgprev">上一页</button>
      <button type="button" class="pgnext">下一页</button>
    </div>
  </div>
</div>
<div class="drawer wide" id="edit" hidden>
  <div class="dpanel">
    <div class="dhead">
      <h2 id="etitle">新建规则</h2>
      <span id="everbadge"></span>
      <span class="spacer"></span>
      <button type="button" class="dclose" id="eclose">关闭 (Esc)</button>
    </div>
    <div class="dbody">
      <div class="fsec">
        <label class="flab" for="ename">规则名</label>
        <input type="text" class="tin" id="ename" placeholder="如：银行流水 · 明细字段">
      </div>
      <div class="fsec">
        <label class="flab" for="edesc">说明</label>
        <input type="text" class="tin" id="edesc" placeholder="用途 / 适用文件…">
      </div>
      <div class="fsec">
        <label class="flab" for="refsel">参考文件
          <span class="hint" tabindex="0" data-tip="公共参考项：三种规则模式都可查看。&#10;简单抽取：选表后按源列自动填充字段定义（源列＝目标列名）。&#10;与参考业务表互相覆盖：后选的来源生效。&#10;复杂 / 智能抽取：仅作查看参考，不改写配置或提示词。">?</span>
        </label>
        <select class="tin" id="refsel">
          <option value="">不使用参考（手动填写源表）</option>
        </select>
      </div>
      <div class="fsec">
        <label class="flab" for="bizds">参考业务表
          <span class="hint" tabindex="0" data-tip="用现有物理表的列结构辅助填写抽取目标列名。&#10;简单抽取：选表后按物理列填好目标列名，可下拉选也可手写；已选源列保持不变。&#10;与参考文件互相覆盖：后选的来源生效。&#10;复杂 / 智能抽取：仅作参考，不改写配置或提示词。">?</span>
        </label>
        <select class="tin" id="bizds">
          <option value="">不使用（手动填写目标列名）</option>
        </select>
        <select class="tin" id="biztable" hidden disabled>
          <option value="">—</option>
        </select>
        <datalist id="bizfieldopts"></datalist>
      </div>
      <div class="fsec">
        <label class="flab">规则模式
          <span class="hint" tabindex="0" data-tip="简单抽取：沿用选表选列方式。&#10;复杂抽取：用场景模板生成配置，也可直接编辑 mapping_json。">?</span>
        </label>
        <div class="modetabs">
          <button type="button" class="tab on" id="modeSimple">简单抽取</button>
          <button type="button" class="tab" id="modeJson">复杂抽取</button>
          <button type="button" class="tab" id="modeSmart">智能抽取</button>
        </div>
      </div>
      <div class="fsec" id="jsonsec" hidden>
        <label class="flab" for="tplKind">场景模板
          <span class="hint" tabindex="0" data-tip="选择常见场景，填写业务参数后点“生成配置”。&#10;复杂抽取可复用 C1 提取规则资产：把已有规则版本的 mapping_json 复制到下方配置框微调。&#10;保存会生成新的不可变版本，旧任务不受影响。">?</span>
        </label>
        <select class="tin" id="tplKind">
          <option value="">自定义</option>
          <option value="table">表格明细抽取</option>
          <option value="kv">证照键值抽取</option>
          <option value="page">按页正文抽取</option>
        </select>
        <div id="tplForm" class="tplform"></div>
        <span><button type="button" class="btn mini" id="genJson">生成配置</button>
          <span class="hint" tabindex="0" data-tip="生成配置会覆盖下方 JSON；生成后仍可手动微调。&#10;JSON 须为对象且含 spec_version=2；保存生成新版本，旧任务不受影响。&#10;此处不做算子级校验，写错算子会在抽取时报错。">?</span></span>
        <div class="flab" style="margin-top:10px">配置预览</div>
        <textarea class="tin jsonarea" id="jsonspec" spellcheck="false" placeholder='{"spec_version":2,"tables":[],"records":{"strategy":"row"},"fields":[]}'></textarea>
      </div>
      <div class="fsec" id="smartSec" hidden>
        <div class="tplform smartform">
          <div class="full tplhead"><span>字段说明</span><span>目标列名</span><span></span></div>
          <div class="full" id="smartRows"></div>
          <button type="button" class="btn mini ghost" id="smartAdd">＋添加字段</button>
        </div>
        <div class="fsec" style="margin-top:12px">
          <label class="flab" for="smartScope">抽取范围</label>
          <select class="tin" id="smartScope">
            <option value="all">全文档</option>
            <option value="page">指定页</option>
          </select>
          <input type="number" class="tin" id="smartPage" min="1" placeholder="页码" hidden style="margin-top:6px;width:120px">
        </div>
        <div class="fsec">
          <label class="flab" for="smartPrompt">提示词模板
            <span class="hint" tabindex="0" data-tip="可选。留空使用内置提示词。&#10;要求模型对每个字段返回 target / value / evidence，evidence 必须取自解析结果原文。">?</span>
          </label>
          <textarea class="tin jsonarea" id="smartPrompt" spellcheck="false" placeholder="留空使用内置提示词；高级用户可自定义"></textarea>
        </div>
        <div class="fsec">
          <label class="flab" for="smartModel">模型名
            <span class="hint" tabindex="0" data-tip="可选。留空使用服务端 C1_LLM_MODEL。&#10;端点与密钥只在服务端环境变量配置，不写入规则版本。">?</span>
          </label>
          <input type="text" class="tin" id="smartModel" placeholder="留空使用服务端默认模型" style="max-width:360px">
        </div>
      </div>
      <div id="simpleSec">
      <div class="fsec">
        <label class="flab" for="tblsel">源表
          <span class="hint" tabindex="0" data-tip="每个规则版本对应一张源表。&#10;序号即候选表顺序：各页非合并表在前，跨页合并表在后。&#10;未选参考文件时，可手动填表序号或表头关键词（取第一张匹配表）。">?</span>
        </label>
        <select class="tin" id="tblsel" disabled>
          <option value="">—</option>
        </select>
        <span id="tmanual">
          <input type="number" class="tin tidx" id="tindex" min="0" placeholder="表序号">
          <input type="text" class="tin tkw" id="tkw" placeholder="或表头关键词（取第一张匹配表）">
        </span>
      </div>
      <div class="fsec">
        <label class="flab">字段定义
          <span class="hint" tabindex="0" data-tip="选定源列，给它起目标列名（即记录键，入库规则按它对齐目标列）。&#10;源列可按列名或列序号指定；转换在入库时生效，暂存值保持不变。&#10;每次保存生成新的不可变版本，旧任务不受影响。">?</span>
        </label>
        <div class="frow fhead" aria-hidden="true">
          <span class="fcol">原始列名</span>
          <span class="fidx" hidden></span>
          <span class="fname">目标列名</span>
          <span class="fxform">转换</span>
          <span class="fdest">入库去向</span>
          <span class="fdel"></span>
        </div>
        <div id="frows"></div>
        <button type="button" class="btn mini ghost" id="addfield">＋添加字段</button>
      </div>
      </div>
      <div class="fsec" id="versec" hidden>
        <label class="flab">版本历史</label>
        <div id="verlist"></div>
      </div>
    </div>
    <div class="dfoot">
      <span class="msg" id="emsg"></span>
      <span class="spacer"></span>
      <button type="button" class="btn danger" id="delbtn" hidden>删除规则</button>
      <button type="button" class="btn" id="savebtn">保存为新版本</button>
    </div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/hint.js"></script>
<script src="/static/extract.js"></script>
</body>
</html>
