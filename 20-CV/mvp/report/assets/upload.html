<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV 提取 MVP · 上传</title>
<link rel="stylesheet" href="/static/upload.css">
</head>
<body>
<div class="wrap">
  <h1>CV 提取 MVP</h1>
  <p class="sub">上传图片 / PDF / CSV → 本地提取 OCR 文字、结构化表格与单元格坐标 → 生成对照报告</p>
  <div class="card">
    <div id="drop">
      <b>点击选择，或把文件拖到这里</b>
      支持 png / jpg / bmp / webp / tif、pdf、csv / txt / md；可多选，单个不超过 20MB
    </div>
    <input type="file" id="picker" multiple>
    <ul class="files" id="filelist"></ul>
    <div class="row">
      <button id="go" disabled>开始提取</button>
      <a class="ghost" id="last" href="/report" style="display:none">查看上次报告 →</a>
      <span id="msg"></span>
    </div>
    <div id="log"></div>
  </div>
  <p class="tip">
    首次处理会加载 PaddleOCR / 表格结构模型，约需 20~40 秒；之后同一进程内复用模型会快很多。<br>
    产物按文件隔离写在 <code>mvp/output/&lt;序号_文件名&gt;/</code>，报告为 <code>mvp/output/index.html</code>。
  </p>
</div>
<script src="/static/upload.js"></script>
</body>
</html>
