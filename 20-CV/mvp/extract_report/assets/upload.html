<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提取 · 上传</title>
<link rel="stylesheet" href="/static/upload.css">
<link rel="stylesheet" href="/static/hint.css">
</head>
<body>
<div class="app">
  <aside class="console">
    <h1>提取</h1>
    <p class="sub">图片 / PDF / CSV → 文字 · 表格 · 坐标</p>
    <div id="drop">
      <b>点击或拖拽文件到此处</b>
      png/jpg/bmp/webp/tif · pdf · csv/txt/md，可多选，单个 ≤ 20MB
    </div>
    <input type="file" id="picker" multiple
      accept=".png,.jpg,.jpeg,.bmp,.webp,.tif,.tiff,.pdf,.csv,.txt,.md">
    <ul class="files" id="filelist"></ul>
    <div class="filebar" id="filebar" hidden>
      <span id="filecount"></span>
      <button type="button" class="mini" id="clearfiles">清空列表</button>
    </div>
    <div class="row">
      <button id="go" disabled>开始提取</button>
      <span id="msg"></span>
    </div>
    <div class="params" id="parampanel">
      <div class="params-head">
        <span class="params-title">参数</span>
        <span class="pbadge" id="parambadge">默认</span>
        <span class="hint" tabindex="0" data-tip="按优先级排，留默认即可；仅影响本次上传。">?</span>
        <span class="spacer"></span>
        <button type="button" class="mini" id="resetparams">恢复默认</button>
      </div>
      <div class="param-groups" id="paramgroups"></div>
    </div>
    <p class="tip">首次加载模型约 20~40 秒，之后复用更快。</p>
  </aside>
  <div class="gutter" id="gutter" title="拖动调整左栏宽度，双击恢复默认"></div>
  <main class="reportcol">
    <div class="reportempty" id="reportempty">
      <div class="re-inner">
        <b>对照报告将显示在这里</b>
        <span>选择文件后点「开始提取」。</span>
      </div>
    </div>
    <div class="runpanel" id="runpanel" hidden>
      <div class="runcard">
        <div class="runbar">
          <span id="runstage">准备中…</span>
          <span class="spacer"></span>
          <span id="runpct">0%</span>
          <a class="mini-link" id="dlLog" href="/api/logs" target="_blank">下载日志</a>
          <button type="button" class="mini-link" id="logclose" hidden>关闭</button>
        </div>
        <div class="track"><div class="fill" id="runfill"></div></div>
        <div class="logbox" id="log"></div>
      </div>
    </div>
    <div class="filetabs" id="filetabs" hidden></div>
    <iframe id="reportFrame" class="reportframe" hidden title="对照报告"></iframe>
    <button type="button" class="logbtn" id="logbtn" hidden>查看日志</button>
  </main>
</div>
<div class="lightbox" id="lightbox" hidden>
  <div class="lbtop">
    <button type="button" id="lbPick">取 x 坐标</button>
    <button type="button" id="lbZoom">1:1 像素</button>
    <span class="lbnote">取数=原图像素，适用 doc_unwarp=off</span>
    <span class="spacer"></span>
    <button type="button" id="lbClose">关闭 (Esc)</button>
  </div>
  <div class="lbstage" id="lbStage">
    <div class="lbwrap" id="lbwrap">
      <img id="lbimg" alt="预览">
      <svg id="lbsvg" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div class="pickbar" id="pickbar" hidden>
    <span class="picklabel">点图取 x</span>
    <span class="pickvals" id="pickvals"></span>
    <button type="button" data-pick="fill">填入列边界</button>
    <button type="button" data-pick="copy">复制</button>
    <button type="button" data-pick="clear">清空</button>
    <button type="button" data-pick="exit">退出取数</button>
  </div>
</div>
<script src="/static/hint.js"></script>
<script src="/static/upload.js"></script>
</body>
</html>
