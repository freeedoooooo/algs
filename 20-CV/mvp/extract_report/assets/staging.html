<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据预览 · 结构化平台</title>
<link rel="stylesheet" href="/static/shell.css">
<link rel="stylesheet" href="/static/staging.css">
</head>
<body>
<nav class="topnav">
  <span class="brand">结构化平台</span>
  <a href="/">提取</a>
  <a href="/sources">资料</a>
  <a class="off" title="P1 开放">模板</a>
  <a class="off" title="P1 开放">校验</a>
  <a class="off" title="P2 开放">入库</a>
  <a href="/runs" class="on">记录</a>
  <span class="spacer"></span>
  <span class="navnote">P0 · 预览链路</span>
</nav>
<div class="pagebody wide">
  <div class="pagehead">
    <h1>数据预览</h1>
    <span class="mono" id="batchtag"></span>
    <span id="tplbadge"></span>
    <span class="spacer"></span>
    <span id="filelinks"></span>
    <a class="btn ghost mini" id="runlink" href="/runs">返回记录</a>
  </div>
  <div class="banner info">只读预览 · 提取出的记录（records.json 暂存事实源）。编辑 / 确认 / 拒绝在校验页 P1 开放。</div>
  <div class="banner err" id="err" hidden></div>
  <div class="filetabs" id="filetabs" hidden></div>
  <div class="stgwrap">
    <div class="panel stgmain">
      <table class="list" id="rectable">
        <thead id="rechead"></thead>
        <tbody id="recrows"></tbody>
      </table>
      <div class="empty" id="empty" hidden><b>没有提取记录</b>该文件未抽出表格行。</div>
    </div>
    <aside class="panel lineage" id="lineage" hidden>
      <div class="lhead">
        <b id="ltitle">血缘回溯</b>
        <span class="lsub" id="lsub"></span>
        <button type="button" class="dclose" id="lclose">收起</button>
      </div>
      <div class="lstage" id="lstage">
        <div class="imgwrap" id="imgwrap">
          <img id="limg" alt="源文件图" title="单击回溯框：定位左侧记录行 / 单元格&#10;单击空白处：放大图片">
          <svg id="lsvg" preserveAspectRatio="none"></svg>
          <span class="viewbar" id="viewbar"></span>
          <button type="button" class="zoombtn" id="zoombtn" title="放大图片">⤢</button>
          <span class="lpager" id="lpager" hidden></span>
        </div>
        <div class="lhint" id="lhint" hidden></div>
      </div>
    </aside>
  </div>
  <div class="msg" id="summary" style="margin-top:10px"></div>
</div>
<div class="stglb" id="stglb" hidden>
  <div class="lbbar">
    <span id="lbtitle">源文件图</span>
    <span class="spacer"></span>
    <span class="lbhint">滚轮缩放 · 拖拽平移 · 单击回溯框定位记录 · Esc 关闭</span>
    <button type="button" class="lbclose" id="lbclose">关闭 ✕</button>
  </div>
  <div class="lbstage" id="lbstage">
    <div class="imgwrap" id="lbwrap">
      <img id="lbimg" alt="源文件图放大">
      <svg id="lbsvg" preserveAspectRatio="none"></svg>
    </div>
  </div>
</div>
<script src="/static/shell.js"></script>
<script src="/static/staging.js"></script>
</body>
</html>
